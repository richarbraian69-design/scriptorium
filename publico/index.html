<title>Scriptorium</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: o mesmo esqueleto do Ora et Labora e do Celeiro. Menu à esquerda; painel central com saudação, banner escuro de sentenças latinas e a vista; na tela Hoje, cartão à direita com os números e a estante isométrica que ganha um livro por dia de estudo. Quase monocromático; a cor viva fica na rubrica (vermelho de manuscrito), nas tags de área e nos livros. */
:root{
  color-scheme: light;
  --bg:#f7f7f5; --painel:#ffffff; --sup:#f2f1ee; --sup-2:#e9e8e4; --linha:#e8e7e3;
  --tx:#1c1c1a; --tx2:#6d6c67; --tx3:#a3a29c;
  --btn:#1c1c1a; --btn-tx:#fafaf8;
  --rubro:#a3321f; --rubro-bg:#f7e4df;
  --alerta:#c0392b; --ok:#2f6b4f; --ok-bg:#e3efe7; --aviso:#8a6200; --aviso-bg:#fbf0d3;
  --banner:#111110; --banner-tx:#f4f3ef; --banner-tx2:#a6a59f;
  --iso-top:#ffffff; --iso-esq:#f0efeb; --iso-dir:#e0dfd9; --iso-linha:#4f4e49; --iso-fant:#c4c3bd; --iso-chao:#f6f5f1;
  --lv-latim:#a3321f; --lv-violino:#a8742f; --lv-ambos:#d9a21b; --chama:#f2b632;
  --sombra:0 1px 2px rgba(20,20,18,.05), 0 8px 24px rgba(20,20,18,.06);
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f0f0e; --painel:#171716; --sup:#211f1e; --sup-2:#2a2826; --linha:#2a2927;
    --tx:#ecebe7; --tx2:#9e9d97; --tx3:#6b6a65; --btn:#ecebe7; --btn-tx:#131312;
    --rubro:#e2735f; --rubro-bg:#3b211c;
    --alerta:#e8705f; --ok:#79c29b; --ok-bg:#1d2e24; --aviso:#e9c35c; --aviso-bg:#3a3017;
    --banner:#f4f3ef; --banner-tx:#151513; --banner-tx2:#6d6c67;
    --iso-top:#2c2b29; --iso-esq:#222120; --iso-dir:#1a1918; --iso-linha:#bdbcb6; --iso-fant:#4a4945; --iso-chao:#1d1c1b;
    --lv-latim:#c4503a; --lv-violino:#b98340; --lv-ambos:#e8b931;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f0f0e; --painel:#171716; --sup:#211f1e; --sup-2:#2a2826; --linha:#2a2927;
  --tx:#ecebe7; --tx2:#9e9d97; --tx3:#6b6a65; --btn:#ecebe7; --btn-tx:#131312;
  --rubro:#e2735f; --rubro-bg:#3b211c;
  --alerta:#e8705f; --ok:#79c29b; --ok-bg:#1d2e24; --aviso:#e9c35c; --aviso-bg:#3a3017;
  --banner:#f4f3ef; --banner-tx:#151513; --banner-tx2:#6d6c67;
  --iso-top:#2c2b29; --iso-esq:#222120; --iso-dir:#1a1918; --iso-linha:#bdbcb6; --iso-fant:#4a4945; --iso-chao:#1d1c1b;
  --lv-latim:#c4503a; --lv-violino:#b98340; --lv-ambos:#e8b931;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--tx);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Isometria */
.iso{display:block;width:100%;height:auto;overflow:visible}
.iso polygon{stroke:var(--iso-linha);stroke-width:.9;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.iso .f-top{fill:var(--iso-top)} .iso .f-esq{fill:var(--iso-esq)} .iso .f-dir{fill:var(--iso-dir)} .iso .f-chao{fill:var(--iso-chao)}
.iso .f-fant{fill:transparent;stroke:var(--iso-fant);stroke-dasharray:3 2}
.iso .lv-t{fill:color-mix(in srgb,var(--lv) 55%,#fff)} .iso .lv-e{fill:var(--lv)} .iso .lv-d{fill:color-mix(in srgb,var(--lv) 70%,#000)}
.iso .lv-b{fill:color-mix(in srgb,var(--lv-ambos) 80%,#fff);stroke:none}
.iso .chama{fill:var(--chama);stroke:none;transform-box:fill-box;transform-origin:50% 100%;animation:tremor 2.4s ease-in-out infinite}
.iso .livro{animation:assentar .5s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i) * 60ms + 150ms)}
@keyframes assentar{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes tremor{0%,100%{transform:scale(1,1)}40%{transform:scale(.88,1.08)}70%{transform:scale(1.06,.94)}}
.iso-escuro{--iso-top:#2c2b29;--iso-esq:#1f1e1d;--iso-dir:#161615;--iso-linha:#b5b4ae;--iso-fant:#4a4945;--iso-chao:#1a1918}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .iso-escuro{--iso-top:#ffffff;--iso-esq:#f0efeb;--iso-dir:#e0dfd9;--iso-linha:#4f4e49;--iso-fant:#c4c3bd;--iso-chao:#f6f5f1}}
:root[data-theme="dark"] .iso-escuro{--iso-top:#ffffff;--iso-esq:#f0efeb;--iso-dir:#e0dfd9;--iso-linha:#4f4e49;--iso-fant:#c4c3bd;--iso-chao:#f6f5f1}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:9px 16px;font-weight:500;font-size:.95rem;cursor:pointer;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-escuro{background:var(--btn);color:var(--btn-tx)} .btn-escuro:hover{opacity:.88}
.btn-claro{background:var(--sup);color:var(--tx);border:1px solid var(--linha)} .btn-claro:hover{background:var(--sup-2)}
.btn-p{padding:6px 11px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--rubro);color:#fff;border-color:transparent}
.link{background:none;border:0;padding:2px 0;color:var(--tx2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--tx3);text-underline-offset:3px;font-size:.88rem}
.link:hover{color:var(--tx)}
.icone-btn{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--tx2);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.icone-btn:hover{background:var(--sup-2);color:var(--tx)}
.icone-btn svg{width:17px;height:17px}
.perigo{color:var(--alerta)!important}

/* Tags */
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:var(--t);color:#fff;font-size:.74rem;font-weight:500;line-height:1;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;border:1px solid var(--linha);color:var(--tx2);font-size:.72rem;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.aviso{background:var(--aviso-bg);color:var(--aviso);border-color:transparent}
.pill.rubro{background:var(--rubro-bg);color:var(--rubro);border-color:transparent}
.ponto{width:9px;height:9px;border-radius:3px;background:var(--t);flex:none;display:inline-block}

/* App */
.app{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:232px minmax(0,1fr);background:var(--bg)}
.lateral{min-width:0;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:20px 14px 16px max(14px, env(safe-area-inset-left,0px))}
.marca{display:flex;align-items:center;gap:10px;padding:2px 8px}
.marca .iso{width:34px}
.marca-nome{font-family:var(--f-serif);font-size:1.45rem;line-height:1;letter-spacing:-.01em}
.marca-sub{font-size:.72rem;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase}
.nav{display:grid;gap:1px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:7px 10px;border:0;border-radius:9px;background:transparent;color:var(--tx);font-size:.94rem;text-align:left;cursor:pointer;white-space:nowrap}
.nav button:hover{background:var(--sup)}
.nav button[aria-current="true"]{background:var(--sup-2);font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.nav .qtd{margin-left:auto;font-size:.8rem;color:var(--tx3);font-variant-numeric:tabular-nums}
.nav .qtd.rubro{color:var(--rubro);font-weight:600}
.nav-rotulo{margin:6px 10px 2px;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.lateral-pe{margin-top:auto;display:grid;gap:8px;padding:0 8px}
.lateral-pe p{margin:0;font-size:.78rem;color:var(--tx3);line-height:1.4}
.lateral-pe em{font-family:var(--f-serif);font-size:1.05em;color:var(--tx2)}

.principal{min-width:0;margin:10px 10px 10px 0;background:var(--painel);border:1px solid var(--linha);border-radius:18px;padding:30px clamp(18px,3.5vw,44px) 72px}
.topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;max-width:1160px;margin:0 auto 22px}
.saudacao{margin:0;font-size:1.6rem;font-weight:500;letter-spacing:-.02em;text-wrap:balance}
.saudacao em{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:1.12em}
.topo-dir{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.data-hoje{font-size:.9rem;color:var(--tx2)}

.conteudo{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"banner lado" "vista lado";gap:22px 24px;align-items:start}
.pagina{max-width:1080px;margin:0 auto;display:grid;gap:26px}
@media (max-width:1180px){.conteudo{grid-template-columns:minmax(0,1fr);grid-template-areas:"banner" "lado" "vista"}}

.banner{grid-area:banner;position:relative;overflow:hidden;border-radius:16px;background:var(--banner);color:var(--banner-tx);min-height:190px;padding:26px clamp(22px,3vw,34px);display:grid;align-content:center;border:1px solid var(--linha)}
.banner-texto{position:relative;z-index:1;max-width:min(31rem,62%);display:grid;gap:8px;justify-items:start}
.cit{display:grid;gap:6px;transition:opacity .6s ease,transform .6s ease}
.cit.some{opacity:0;transform:translateY(6px)}
.cit-la{display:grid;gap:6px}
.banner blockquote{margin:0;font-family:var(--f-serif);font-style:italic;font-size:clamp(1.35rem,2.3vw,1.75rem);line-height:1.18;text-wrap:pretty}
.banner .trad{margin:0;font-size:.92rem;line-height:1.4;color:var(--banner-tx)}
.banner .autor{margin:0;color:var(--banner-tx2);font-size:.84rem}
.banner .btn{margin-top:6px;background:var(--banner-tx);color:var(--banner)}
.banner-arte{position:absolute;right:4px;bottom:-14px;width:min(40%,290px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
.banner-prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:color-mix(in srgb,var(--banner-tx) 10%,transparent)}
.banner-prog i{display:block;height:100%;background:color-mix(in srgb,var(--banner-tx) 45%,transparent);transform-origin:left;animation:progresso 15s linear forwards}
@keyframes progresso{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:640px){.banner-arte{opacity:.28;width:70%}.banner-texto{max-width:100%}}

.lado{grid-area:lado;background:var(--painel);border:1px solid var(--linha);border-radius:16px;overflow:hidden}
.numeros{padding:18px 22px;display:grid;gap:12px}
.num{display:grid;gap:0}
.num small{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.num b{font-family:var(--f-serif);font-weight:400;font-size:1.85rem;line-height:1.1;font-variant-numeric:tabular-nums}
.num span{color:var(--tx2);font-size:.86rem}
.num.rubro b{color:var(--rubro)}
.est-card{border-top:1px solid var(--linha);padding:16px 16px 18px;display:grid;gap:10px}
.est-topo{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px}
.est-tit{margin:0;font-weight:600;font-size:.98rem}
.est-tit em{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:1.2em}
.est-n{font-size:.8rem;color:var(--tx3);font-variant-numeric:tabular-nums}
.est-arte{background:var(--bg);border-radius:12px;padding:12px 18px 8px}
.legenda{display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 4px;font-size:.78rem;color:var(--tx2)}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.est-txt{margin:0;padding:0 4px;font-size:.84rem;color:var(--tx2)}
.est-txt b{color:var(--tx);font-weight:500}
@media (max-width:1180px){.lado{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}.est-card{border-top:0;border-left:1px solid var(--linha)}.numeros{grid-template-columns:1fr 1fr;align-content:center}}
@media (max-width:640px){.lado{grid-template-columns:minmax(0,1fr)}.est-card{border-left:0;border-top:1px solid var(--linha)}}

.vista{grid-area:vista;min-width:0;display:grid;gap:24px}
.secao{display:grid;gap:10px;min-width:0}
.secao-topo{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.rot{margin:0;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2)}
.h2{margin:0;font-family:var(--f-serif);font-weight:400;font-size:2rem;line-height:1.05;letter-spacing:-.005em;text-wrap:balance}
.h2 em{font-style:italic;color:var(--tx2)}
.intro{margin:4px 0 0;color:var(--tx2);max-width:62ch;font-size:.94rem}
.painel{background:var(--painel);border:1px solid var(--linha);border-radius:14px;overflow:hidden;min-width:0}
.painel.pad{padding:16px 18px}
.vazio{margin:0;padding:22px 20px;color:var(--tx2)}
.vazio em{font-family:var(--f-serif);font-size:1.15em;color:var(--tx)}
.nota{margin:0;font-size:.84rem;color:var(--tx2)}
.nota b{color:var(--tx);font-weight:500}

.barra{height:6px;border-radius:3px;background:var(--linha);overflow:hidden}
.barra i{display:block;height:100%;border-radius:3px;background:var(--tx);transition:width .6s}
.barra.rubro i{background:var(--rubro)}

/* Práticas */
.praticas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.pratica{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:18px 20px;display:grid;gap:12px;align-content:start;min-width:0}
.pratica-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pratica h3{margin:0;font-weight:500;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.pratica h3 svg{width:18px;height:18px;color:var(--tx2)}
.cap-grande{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cap-grande b{font-family:var(--f-serif);font-weight:400;font-size:2.4rem;line-height:1;color:var(--rubro)}
.cap-grande span{font-family:var(--f-serif);font-style:italic;font-size:1.3rem}
.pratica .sub{margin:0;font-size:.88rem;color:var(--tx2)}
.pratica .sub b{color:var(--tx);font-weight:500}
.foco{display:grid;gap:6px}
.foco div{display:flex;align-items:center;gap:8px;font-size:.92rem}
.foco small{color:var(--tx3);font-size:.8rem;margin-left:auto;white-space:nowrap}
.cron{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--linha);border-radius:12px;padding:10px 12px}
.cron b{font-family:var(--f-serif);font-weight:400;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums;min-width:4.2ch}
.cron.fim b{color:var(--ok)}
.acoes{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* Ferramentas do violino */
.ferr{display:grid;gap:12px;background:var(--bg);border:1px solid var(--linha);border-radius:12px;padding:12px 14px}
.ferr-linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ferr-linha > span{font-size:.8rem;font-weight:500;color:var(--tx2);min-width:84px}
.bpm{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--linha);border-radius:10px;background:var(--painel);padding:2px}
.bpm input{width:52px;border:0;background:transparent;text-align:center;font-variant-numeric:tabular-nums;font-weight:500;padding:4px 0}
.bpm input:focus{outline:none}
.pulso{width:10px;height:10px;border-radius:50%;background:var(--linha)}
.pulso.bate{animation:bate .12s ease-out}
@keyframes bate{from{background:var(--rubro);transform:scale(1.3)}to{background:var(--linha)}}

/* Captura */
.captura{display:grid;gap:10px;background:var(--bg);border:1px solid var(--linha);border-radius:14px;padding:14px 16px}
.captura-linha{display:flex;gap:8px}
.captura-linha .campo{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);background:var(--painel);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer;color:var(--tx)}
.chip[aria-pressed="true"]{border-color:var(--tx);background:var(--sup-2)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--linha);border-radius:10px;padding:2px;background:var(--bg);gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 11px;font-size:.86rem;cursor:pointer;color:var(--tx2)}
.seg button[aria-pressed="true"]{background:var(--painel);color:var(--tx);font-weight:500;box-shadow:var(--sombra)}
.seg small{color:var(--tx3);margin-left:4px;font-variant-numeric:tabular-nums}

/* Itens do banco */
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 10px 12px 14px;border-top:1px solid var(--linha)}
.it:first-child{border-top:0}
.it:hover{background:var(--sup)}
.it-tipo{width:30px;height:30px;border-radius:8px;background:var(--sup);display:grid;place-items:center;color:var(--tx2)}
.it-tipo svg{width:16px;height:16px}
.it-t{min-width:0;display:grid;gap:3px;cursor:pointer}
.it-t b{font-weight:500;overflow-wrap:anywhere}
.it-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.8rem;color:var(--tx3)}
.it-meta a{color:var(--tx2);overflow-wrap:anywhere}
.it-acoes{display:flex;align-items:center;gap:2px}
.estrela.on{color:var(--lv-ambos)}
.estrela.on svg{fill:currentColor}
.it.feito b{color:var(--tx2);text-decoration:line-through;text-decoration-color:var(--tx3)}

/* Latim */
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.cap{border:1px solid var(--linha);background:var(--painel);border-radius:9px;padding:8px 4px;display:grid;justify-items:center;gap:2px;cursor:pointer;color:var(--tx3)}
.cap b{font-family:var(--f-serif);font-weight:400;font-size:1.15rem;line-height:1}
.cap small{font-size:.66rem;font-variant-numeric:tabular-nums}
.cap.feito{background:var(--sup-2);color:var(--tx)}
.cap.atual{border-color:var(--rubro);color:var(--rubro);box-shadow:inset 0 0 0 1px var(--rubro)}
.cap.ver{outline:2px solid var(--tx);outline-offset:1px}
.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.duas{grid-template-columns:minmax(0,1fr)}}
.cartao{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:16px 18px;display:grid;gap:12px;align-content:start;min-width:0}
.cartao h4{margin:0;font-weight:500;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cartao h4 em{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:1.15em}
.check{display:grid;gap:0}
.ck{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--linha);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.ck:first-child{border-top:0}
.ck > span:not(.circ){flex:1}

/* Violino */

.faixa{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;background:var(--aviso-bg);color:var(--aviso);font-size:.9rem}

.folha{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--painel);border:1px solid var(--linha);border-radius:16px;box-shadow:var(--sombra);padding:20px 22px;display:grid;gap:14px}

@keyframes aparecer{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:860px){

  .ex{grid-template-columns:minmax(0,1fr) auto}
  .ex .spark-c{display:none}
}
/* ===== Visual 2 (igual ao Ora et Labora): cor do tempo litúrgico, menos bordas, mais espaço ===== */
:root{--ac:#9C7412;--ac-tx:#86620C;--ac-suave:rgba(156,116,18,.12);--ac-sobre:#FFFFFF;--lv-estudo:#5f7f8f}

  :root:not([data-theme="light"])[data-lit="branco"]{--ac:#F1ECDD;--ac-tx:#E5C778;--ac-suave:rgba(229,199,120,.14);--ac-sobre:#1A1A18}
  :root:not([data-theme="light"])[data-lit="verde"]{--ac:#5FB37E;--ac-tx:#7CC896;--ac-suave:rgba(95,179,126,.14);--ac-sobre:#06140B}
  :root:not([data-theme="light"])[data-lit="roxo"]{--ac:#A688DB;--ac-tx:#B9A0E6;--ac-suave:rgba(166,136,219,.15);--ac-sobre:#140B22}
  :root:not([data-theme="light"])[data-lit="rosa"]{--ac:#E592B8;--ac-tx:#EFA9C9;--ac-suave:rgba(229,146,184,.14);--ac-sobre:#22091A}
  :root:not([data-theme="light"])[data-lit="vermelho"]{--ac:#E2685F;--ac-tx:#EE8A82;--ac-suave:rgba(226,104,95,.14);--ac-sobre:#1E0806}
  :root:not([data-theme="light"]) .painel,:root:not([data-theme="light"]) .lado,:root:not([data-theme="light"]) .banner,:root:not([data-theme="light"]) .pratica,:root:not([data-theme="light"]) .cartao{box-shadow:none}
}
:root[data-theme="dark"],:root[data-theme="dark"][data-lit="ouro"]{--ac:#D6AE4F;--ac-tx:#E2BE6A;--ac-suave:rgba(214,174,79,.14);--ac-sobre:#1A1406}

:root[data-theme="dark"][data-lit="verde"]{--ac:#5FB37E;--ac-tx:#7CC896;--ac-suave:rgba(95,179,126,.14);--ac-sobre:#06140B}

:root[data-theme="dark"][data-lit="rosa"]{--ac:#E592B8;--ac-tx:#EFA9C9;--ac-suave:rgba(229,146,184,.14);--ac-sobre:#22091A}
:root[data-theme="dark"][data-lit="vermelho"]{--ac:#E2685F;--ac-tx:#EE8A82;--ac-suave:rgba(226,104,95,.14);--ac-sobre:#1E0806}
:root[data-theme="dark"] .painel,:root[data-theme="dark"] .lado,:root[data-theme="dark"] .banner,:root[data-theme="dark"] .pratica,:root[data-theme="dark"] .cartao{box-shadow:none}

.app{box-shadow:inset 0 3px 0 var(--ac)}

.sala-visor{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--painel);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(20,20,18,.05)}
.sala-abas{grid-row:1;display:flex;gap:4px;overflow-x:auto;padding:8px 10px 0}
.sala-abas:empty{display:none}
.sala-abas button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:.84rem;color:var(--tx2);cursor:pointer;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.sala-abas button[aria-pressed="true"]{background:var(--ac-suave);color:var(--ac-tx);font-weight:600}
.sala-area{grid-row:2;min-width:0;min-height:0;position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.sala-area iframe,.sala-area video{width:100%;height:100%;border:0;display:block;background:#000}
.sala-area iframe.doc{background:#fff}
.sala-area img{width:100%;height:100%;object-fit:contain}
.sala-area audio{width:calc(100% - 32px);align-self:center;justify-self:center}
.sala-aviso{align-self:center;justify-self:center;display:grid;justify-items:center;gap:12px;text-align:center;padding:32px 20px;max-width:440px;color:var(--tx2)}
.sala-aviso h3{margin:0;font-family:var(--f-serif);font-weight:400;font-size:1.6rem;line-height:1.1;color:var(--tx)}
.sala-aviso p{margin:0}
.sala-lado{min-height:0;overflow-y:auto;display:grid;gap:14px;align-content:start;padding:2px}
.sala-bloco{background:var(--painel);border-radius:16px;padding:14px 16px;display:grid;gap:10px;box-shadow:0 1px 2px rgba(20,20,18,.05)}
.sala-bloco h4{margin:0;font-weight:600;font-size:.92rem}
.sala-bloco textarea{min-height:150px}
.sala-bloco .check .ck{padding:6px 0;font-size:.9rem}
.ir-chips{display:flex;flex-wrap:wrap;gap:6px}
.salvo{font-size:.76rem;color:var(--tx3)}
@media (max-width:600px){
  .sala-topo{flex-wrap:wrap}
  .sala-tit{flex:1 1 calc(100% - 46px)}
  .sala-tempo{margin-right:auto;margin-left:40px}
}
@media (max-width:900px){
  .sala-corpo{grid-template-columns:minmax(0,1fr);grid-template-rows:none;overflow-y:auto;align-content:start}
  .sala-visor{height:68dvh}
  .sala-lado{overflow:visible}
}

/* Leitor de PDF */
.leitor{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);position:relative}
.leitor-barra{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:8px 10px}
.leitor-barra .campo{width:56px;padding:4px 6px;text-align:center;font-variant-numeric:tabular-nums;font-size:.88rem}
.leitor-barra .de{font-size:.84rem;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.leitor-barra .esp{flex:1}
.leitor-rolo{overflow:auto;background:var(--sup);padding:10px;-webkit-overflow-scrolling:touch}
.leitor-folha{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.leitor-folha canvas{display:block}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:rgba(217,162,27,.4);color:transparent}
.leitor-sum{position:absolute;left:10px;top:48px;z-index:6;width:min(320px,calc(100% - 20px));max-height:calc(100% - 60px);overflow:auto;background:var(--painel);border-radius:12px;box-shadow:var(--sombra);padding:6px;display:grid;gap:1px}
.leitor-sum button{border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:8px;font-size:.88rem;color:var(--tx);cursor:pointer}
.leitor-sum button:hover{background:var(--sup)}
.leitor-sum button.sub{padding-left:24px;color:var(--tx2);font-size:.82rem}

var T=null, tTick=null, travaTela=null;

var FESTAS_FIXAS={'01-01':['Santa Maria, Mãe de Deus','branco'],'03-19':['São José','branco'],'03-25':['Anunciação do Senhor','branco'],'06-24':['Natividade de São João Batista','branco'],'06-29':['São Pedro e São Paulo','vermelho'],'08-15':['Assunção de Nossa Senhora','branco'],'10-12':['Nossa Senhora Aparecida','branco'],'11-01':['Todos os Santos','branco'],'11-02':['Fiéis Defuntos','roxo'],'12-08':['Imaculada Conceição','branco']};

function fmtTam(b){ b=Number(b)||0; if(b<1048576) return Math.max(1,Math.round(b/1024))+' KB'; if(b<1073741824) return (b/1048576).toFixed(b<104857600?1:0).replace('.',',')+' MB'; return (b/1073741824).toFixed(1).replace('.',',')+' GB'; }

function enviarArquivo(file,extra,livro){
  if(!SERVIDOR) return;
  var e={nome:file.name,tam:file.size,pct:0}; ENVIOS.push(e); desenharEnvios();
  function fim(){ ENVIOS.splice(ENVIOS.indexOf(e),1); desenharEnvios(); }
  var x=new XMLHttpRequest();
  x.open('POST','/api/arquivos');
  x.setRequestHeader('X-Scriptorium','1');
  x.setRequestHeader('Content-Type',file.type||'application/octet-stream');
  x.setRequestHeader('X-Nome',encodeURIComponent(file.name));
  x.setRequestHeader('X-Meta',encodeURIComponent(JSON.stringify(extra||{})));
  x.upload.onprogress=function(p){ if(p.lengthComputable){ e.pct=Math.floor(p.loaded/p.total*100); desenharEnvios(); } };
  x.onload=function(){
    fim(); var j={}; try{ j=JSON.parse(x.responseText); }catch(err){}
    if(x.status<200||x.status>=300){ toast('Não enviei '+esc(file.name), j.erro||'Tente de novo.'); return; }
    var doc=j.doc; doc.id=j.id; if(!S.arqs.some(function(a){ return a.id===j.id; })) S.arqs.push(doc);
    carregarEspaco(); toast('Arquivo guardado', file.name);

    if(SALA && (livro || (SALA.tipo==='item' && extra.item===SALA.id))){ SALA.fonte='arq:'+j.id; renderVisor(); }
    render();
  };
  x.onerror=function(){ fim(); toast('Não enviei '+esc(file.name),'A conexão caiu. Tente de novo.'); };
  x.send(file);
}

    case 'f-status': S.fStatus=el.dataset.s; render(); break;

    case 'status': var b2=S.banco.filter(function(x){return x.id===el.dataset.id;})[0]; if(b2){ b2.status=el.dataset.s; if(b2.status==='concluido'){ b2.concluido=hoje(); b2.semana=false; } gravar('banco/'+b2.id,b2); toast(b2.status==='concluido'?'Concluído. <em>Deo gratias.</em>':'Agora em estudo'); render(); } break;
    case 'revisao-feita': var G=ger(); G.ultimaRevisao=hoje(); S.ger=G; salvarGer(); toast('Revisão da fila registrada'); render(); break;
    case 'cron': cronIniciar(el.dataset.p); break;
    case 'cron-pausa': cronPausar(); break;
    case 'cron-parar': cronParar(false); break;
    case 'sessao': abrirSessao(el.dataset.p); break;
    case 'fechar': S.modal=null; S.rev=null; renderModal(); render(); break;
    case 'met': metAlternar(); break;
    case 'bpm': metBpm(MET.bpm+Number(el.dataset.n)); break;
    case 'drone': droneAlternar(el.dataset.nome, Number(el.dataset.f)); break;
    case 'cap-ver': S.capVer=Number(el.dataset.n); render(); break;
    case 'parte': var L=lat(), n=el.dataset.n; L.feitos=L.feitos||{}; L.feitos[n]=L.feitos[n]||{}; L.feitos[n][el.dataset.p]=!L.feitos[n][el.dataset.p]; S.lat=L; salvarLat(); render(); break;
    case 'avancar-cap': var L2=lat(); if(L2.atual<35){ L2.atual++; S.lat=L2; S.capVer=null; salvarLat(); toast('Capitulum '+romano(L2.atual)+': <em lang="la">'+esc(CAPS[L2.atual-1])+'</em>'); render(); } break;
    case 'definir-cap': var L3=lat(); L3.atual=Number(el.dataset.n); S.lat=L3; S.capVer=null; salvarLat(); render(); break;
    case 'revisar': var fila=vocabVencido().sort(function(){ return Math.random()-0.5; }).map(function(v){ return v.id; }); if(!fila.length) return; S.rev={fila:fila,i:0,mostrar:false,certas:0,erradas:0,errou:{}}; S.modal={tipo:'rev'}; renderModal(); break;
    case 'rev-mostrar': S.rev.mostrar=true; renderModal(); break;
    case 'rev-resp': responder(el.dataset.ok==='1'); break;
    case 'novo-ex': S.modal={tipo:'ex'}; renderModal(); break;
    case 'editar-ex': S.modal={tipo:'ex',id:el.dataset.id}; renderModal(); break;
    case 'pre-apagar': S.confirmar=el.dataset.k; if(S.modal) renderModal(); render(); break;
    case 'apagar':
      var k=el.dataset.k, col=k.split('/')[0], id=k.split('/')[1];
      if(col==='banco') S.banco=S.banco.filter(function(x){return x.id!==id;});
      if(col==='sessoes') S.sess=S.sess.filter(function(x){return x.id!==id;});
      if(col==='vocab') S.vocab=S.vocab.filter(function(x){return x.id!==id;});
      apagar(k); S.confirmar=null; if(col==='banco') S.modal=null; toast('Apagado'); render(); break;
    case 'apagar-ex': var V=vio(); V.exercicios=(V.exercicios||[]).filter(function(x){ return x.id!==el.dataset.id; }); S.vio=V; salvarVio(); S.modal=null; S.confirmar=null; toast('Exercício apagado'); render(); break;
  }

/* ---------- Versão de servidor (Railway): login e dados no disco ---------- */
function api(metodo,url,corpo){
  var h={'X-Scriptorium':'1'}; if(corpo!==undefined) h['Content-Type']='application/json';
  return fetch(url,{method:metodo,headers:h,credentials:'same-origin',cache:'no-store',body:corpo!==undefined?JSON.stringify(corpo):undefined}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){
      if(r.status===401 && S.usuario){ location.reload(); }
      if(!r.ok) throw {code:'unavailable', status:r.status, message:j.erro||'Não consegui falar com o servidor.'};
      return j;
    });
  }, function(){ throw {code:'unavailable', status:0, message:'Sem conexão com o servidor. Confira a internet.'}; });
}
function novoIdLocal(){ var a=new Uint8Array(15), s=''; crypto.getRandomValues(a); for(var i=0;i<a.length;i++) s+='abcdefghijklmnopqrstuvwxyz0123456789'[a[i]%36]; return s; }
/* Mesmo jeito de usar do banco do artifact (doc, collection, where, onSnapshot, set, delete), guardado no servidor. */
function criarBanco(){
  var cache={}, seq=0, subs=[], pronto=false, emCurso=null, deNovo=false;
  function copia(o){ return o===undefined?undefined:JSON.parse(JSON.stringify(o)); }
  function snap(p){ var d=cache[p]; return {id:p.split('/')[1], exists:d!==undefined, data:function(){ return copia(d); }}; }
  function testa(v,op,x){ switch(op){ case '==':return v===x; case '!=':return v!==x; case '<':return v<x; case '<=':return v<=x; case '>':return v>x; case '>=':return v>=x; } return true; }
  function rodar(s){
    try{
      if(s.tipo==='doc') return s.cb(snap(s.path));
      var ds=Object.keys(cache).filter(function(p){ if(p.split('/')[0]!==s.col) return false; var d=cache[p]; return s.filtros.every(function(f){ return testa(d[f[0]],f[1],f[2]); }); }).sort().map(snap);
      s.cb({docs:ds,size:ds.length,empty:!ds.length});
    }catch(e){ console.error(e); }
  }
  function notificar(){ if(pronto) subs.slice().forEach(rodar); }
  function aplicar(r){ if(r.completo) cache={}; Object.keys(r.docs||{}).forEach(function(p){ cache[p]=r.docs[p]; }); (r.apagados||[]).forEach(function(p){ delete cache[p]; }); seq=r.seq; }
  function sincronizar(){
    if(!pronto) return Promise.resolve();
    if(emCurso){ deNovo=true; return emCurso; }
    emCurso=api('GET','/api/dados?desde='+seq).then(function(r){ aplicar(r); notificar(); }).catch(function(e){ console.warn('[scriptorium] sincronização', e); })
      .then(function(){ emCurso=null; if(deNovo){ deNovo=false; return sincronizar(); } });
    return emCurso;
  }
  function partes(p){ var a=String(p).split('/'); if(a.length!==2||!a[0]||!a[1]) throw new TypeError('Caminho inválido: '+p); return a; }
  function enviar(metodo,p,dados){
    var a=partes(p);
    return api(metodo,'/api/doc/'+encodeURIComponent(a[0])+'/'+encodeURIComponent(a[1]),dados===undefined?undefined:{data:dados})
      .then(function(){}, function(e){ seq=0; cache={}; api('GET','/api/dados').then(function(r){ aplicar(r); notificar(); }).catch(function(){}); throw e; });
  }
  function doc(p){
    partes(p);
    return {
      id:p.split('/')[1],
      set:function(d){ cache[p]=copia(d); notificar(); return enviar('PUT',p,d); },
      'delete':function(){ delete cache[p]; notificar(); return enviar('DELETE',p); },
      onSnapshot:function(cb){ var s={tipo:'doc',path:p,cb:cb}; subs.push(s); if(pronto) setTimeout(function(){ rodar(s); },0); return function(){ var i=subs.indexOf(s); if(i>=0) subs.splice(i,1); }; }
    };
  }
  function consulta(col,filtros){
    return {
      where:function(f,op,v){ return consulta(col,filtros.concat([[f,op,v]])); },
      onSnapshot:function(cb){ var s={tipo:'col',col:col,filtros:filtros,cb:cb}; subs.push(s); if(pronto) setTimeout(function(){ rodar(s); },0); return function(){ var i=subs.indexOf(s); if(i>=0) subs.splice(i,1); }; },
      doc:function(id){ return doc(col+'/'+(id||novoIdLocal())); }
    };
  }
  function ouvir(){
    try{ var es=new EventSource('/api/eventos'); es.onmessage=function(e){ if(Number(e.data)>seq) sincronizar(); }; }catch(e){}
    document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') sincronizar(); });
    window.addEventListener('online',sincronizar);
    setInterval(sincronizar,60000);
  }
  return {
    doc:doc, collection:function(c){ return consulta(c,[]); }, sincronizar:sincronizar,
    iniciar:function(){ return api('GET','/api/dados').then(function(r){ aplicar(r); pronto=true; notificar(); ouvir(); }); }
  };
}

    (S.semDisco?'<p class="ent-aviso">O servidor está sem disco: os dados somem a cada atualização. Ligue um volume em /data no Railway antes de começar.</p>':'')+
    '<form class="ent-forma" data-form="'+(modo==='primeiro'?'primeiro':'entrar')+'">'+

      '<button class="btn btn-escuro" type="submit">'+(modo==='primeiro'?'Criar conta e entrar':'Entrar')+'</button></form>'+
    '<p class="ent-cit"><em lang="la">“Tolle, lege.”</em> Santo Agostinho</p>';
  el.innerHTML='<div class="ent-centro"><div class="ent-arte">'+estante({dias:ultimos12(),label:'Estante'})+'</div><h1 class="ent-marca">Scriptorium</h1>'+c+'</div>';
