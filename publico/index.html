<title>Scriptorium</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Identidade das "ilhas pretas" (19/11/2026, a mesma do JARVIS): fundo cinza-escuro, o conteúdo numa ilha preta colada no topo com os cantos de baixo arredondados, botões redondos pretos na coluna da esquerda, quadrados escuros de borda fina, barras brancas, laranja só no que está ativo, fonte do Mac. Sempre escuro; a cor do tempo litúrgico fica só no pontinho ao lado da data. */
:root{
  color-scheme: dark;
  --fundo:#18181b; --ilha:linear-gradient(180deg,#000000 0%,#050507 70%,#07080c 100%);
  --bg:rgba(255,255,255,.04); --painel:rgba(255,255,255,.065); --painel-solido:#141416; --sup:rgba(255,255,255,.09); --sup-2:rgba(255,255,255,.14); --linha:rgba(255,255,255,.10); --borda:rgba(255,255,255,.09); --borda-rd:rgba(255,255,255,.14); --trilho:#3a3a3c;
  --tx:#ffffff; --tx2:#a1a1a6; --tx3:#8e8e93;
  --btn:#ffffff; --btn-tx:#000000;
  --rubro:#ff453a; --rubro-bg:rgba(255,69,58,.18);
  --alerta:#ff453a; --ok:#30d158; --ok-bg:rgba(48,209,88,.16); --aviso:#ff9f0a; --aviso-bg:rgba(255,159,10,.16);
  --banner:rgba(255,255,255,.065); --banner-tx:#ffffff; --banner-tx2:#a1a1a6;
  --iso-top:#2c2c2e; --iso-esq:#1c1c1e; --iso-dir:#141416; --iso-linha:#a1a1a6; --iso-fant:#48484a; --iso-chao:#18181b;
  --lv-latim:#c7c7cc; --lv-violino:#636366; --lv-ambos:#ffffff; --chama:#ff9f0a;
  --sombra:0 24px 60px rgba(0,0,0,.6); --sombra-ilha:0 24px 60px rgba(0,0,0,.6);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
  --f-serif:var(--f-ui);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--tx);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Isometria */
.iso{display:block;width:100%;height:auto;overflow:visible}
.iso polygon{stroke:var(--iso-linha);stroke-width:.9;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.iso .f-top{fill:var(--iso-top)} .iso .f-esq{fill:var(--iso-esq)} .iso .f-dir{fill:var(--iso-dir)} .iso .f-chao{fill:var(--iso-chao)}
.iso .f-fant{fill:transparent;stroke:var(--iso-fant);stroke-dasharray:3 2}
.iso .lv-t{fill:color-mix(in srgb,var(--lv) 55%,#fff)} .iso .lv-e{fill:var(--lv)} .iso .lv-d{fill:color-mix(in srgb,var(--lv) 70%,#000)}
.iso .lv-b{fill:color-mix(in srgb,var(--lv-ambos) 80%,#fff);stroke:none}
.iso .chama{fill:var(--chama);stroke:none;transform-box:fill-box;transform-origin:50% 100%;animation:tremor 2.4s ease-in-out infinite}
.iso .livro{animation:assentar .5s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i) * 60ms + 150ms)}
@keyframes assentar{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes tremor{0%,100%{transform:scale(1,1)}40%{transform:scale(.88,1.08)}70%{transform:scale(1.06,.94)}}
.iso-escuro{--iso-top:#2c2c2e;--iso-esq:#1c1c1e;--iso-dir:#141416;--iso-linha:#a1a1a6;--iso-fant:#48484a;--iso-chao:#18181b}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:9px 16px;font-weight:500;font-size:.95rem;cursor:pointer;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-escuro{background:var(--btn);color:var(--btn-tx)} .btn-escuro:hover{opacity:.88}
.btn-claro{background:var(--sup);color:var(--tx);border:1px solid var(--linha)} .btn-claro:hover{background:var(--sup-2)}
.btn-p{padding:6px 11px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--rubro);color:#fff;border-color:transparent}
.link{background:none;border:0;padding:2px 0;color:var(--tx2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--tx3);text-underline-offset:3px;font-size:.88rem}
.link:hover{color:var(--tx)}
.icone-btn{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--tx2);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.icone-btn:hover{background:var(--sup-2);color:var(--tx)}
.icone-btn svg{width:17px;height:17px}
.perigo{color:var(--alerta)!important}

/* Tags */
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:var(--t);color:#fff;font-size:.74rem;font-weight:500;line-height:1;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;border:1px solid var(--linha);color:var(--tx2);font-size:.72rem;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.aviso{background:var(--aviso-bg);color:var(--aviso);border-color:transparent}
.pill.rubro{background:var(--rubro-bg);color:var(--rubro);border-color:transparent}
.ponto{width:9px;height:9px;border-radius:3px;background:var(--t);flex:none;display:inline-block}

/* App */
.app{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:232px minmax(0,1fr);background:var(--bg)}
.lateral{min-width:0;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:20px 14px 16px max(14px, env(safe-area-inset-left,0px))}
.marca{display:flex;align-items:center;gap:10px;padding:2px 8px}
.marca .iso{width:34px}
.marca-nome{font-family:var(--f-serif);font-size:1.45rem;line-height:1;letter-spacing:-.01em}
.marca-sub{font-size:.72rem;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase}
.nav{display:grid;gap:1px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:7px 10px;border:0;border-radius:9px;background:transparent;color:var(--tx);font-size:.94rem;text-align:left;cursor:pointer;white-space:nowrap}
.nav button:hover{background:var(--sup)}
.nav button[aria-current="true"]{background:var(--sup-2);font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.nav .qtd{margin-left:auto;font-size:.8rem;color:var(--tx3);font-variant-numeric:tabular-nums}
.nav .qtd.rubro{color:var(--rubro);font-weight:600}
.nav-rotulo{margin:6px 10px 2px;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.lateral-pe{margin-top:auto;display:grid;gap:8px;padding:0 8px}
.lateral-pe p{margin:0;font-size:.78rem;color:var(--tx3);line-height:1.4}
.lateral-pe em{font-family:var(--f-serif);font-size:1.05em;color:var(--tx2)}

.principal{min-width:0;margin:10px 10px 10px 0;background:var(--painel);border:1px solid var(--linha);border-radius:18px;padding:30px clamp(18px,3.5vw,44px) 72px}
.topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;max-width:1160px;margin:0 auto 22px}
.saudacao{margin:0;font-size:1.6rem;font-weight:500;letter-spacing:-.02em;text-wrap:balance}
.saudacao em{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:1.12em}
.topo-dir{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.data-hoje{font-size:.9rem;color:var(--tx2)}

.conteudo{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"banner lado" "vista lado";gap:22px 24px;align-items:start}
.pagina{max-width:1080px;margin:0 auto;display:grid;gap:26px}
@media (max-width:1180px){.conteudo{grid-template-columns:minmax(0,1fr);grid-template-areas:"banner" "lado" "vista"}}

.banner{grid-area:banner;position:relative;overflow:hidden;border-radius:16px;background:var(--banner);color:var(--banner-tx);min-height:190px;padding:26px clamp(22px,3vw,34px);display:grid;align-content:center;border:1px solid var(--linha)}
.banner-texto{position:relative;z-index:1;max-width:min(31rem,62%);display:grid;gap:8px;justify-items:start}
.cit{display:grid;gap:6px;transition:opacity .6s ease,transform .6s ease}
.cit.some{opacity:0;transform:translateY(6px)}
.cit-la{display:grid;gap:6px}
.banner blockquote{margin:0;font-family:var(--f-serif);font-style:italic;font-size:clamp(1.35rem,2.3vw,1.75rem);line-height:1.18;text-wrap:pretty}
.banner .trad{margin:0;font-size:.92rem;line-height:1.4;color:var(--banner-tx)}
.banner .autor{margin:0;color:var(--banner-tx2);font-size:.84rem}
.banner .btn{margin-top:6px;background:var(--banner-tx);color:var(--banner)}
.banner-arte{position:absolute;right:4px;bottom:-14px;width:min(40%,290px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
.banner-prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:color-mix(in srgb,var(--banner-tx) 10%,transparent)}
.banner-prog i{display:block;height:100%;background:color-mix(in srgb,var(--banner-tx) 45%,transparent);transform-origin:left;animation:progresso 15s linear forwards}
@keyframes progresso{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:640px){.banner-arte{opacity:.28;width:70%}.banner-texto{max-width:100%}}

.lado{grid-area:lado;background:var(--painel);border:1px solid var(--linha);border-radius:16px;overflow:hidden}
.numeros{padding:18px 22px;display:grid;gap:12px}
.num{display:grid;gap:0}
.num small{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.num b{font-family:var(--f-serif);font-weight:400;font-size:1.85rem;line-height:1.1;font-variant-numeric:tabular-nums}
.num span{color:var(--tx2);font-size:.86rem}
.num.rubro b{color:var(--rubro)}
.est-card{border-top:1px solid var(--linha);padding:16px 16px 18px;display:grid;gap:10px}
.est-topo{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px}
.est-tit{margin:0;font-weight:600;font-size:.98rem}
.est-tit em{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:1.2em}
.est-n{font-size:.8rem;color:var(--tx3);font-variant-numeric:tabular-nums}
.est-arte{background:var(--bg);border-radius:12px;padding:12px 18px 8px}
.legenda{display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 4px;font-size:.78rem;color:var(--tx2)}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.est-txt{margin:0;padding:0 4px;font-size:.84rem;color:var(--tx2)}
.est-txt b{color:var(--tx);font-weight:500}
@media (max-width:1180px){.lado{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}.est-card{border-top:0;border-left:1px solid var(--linha)}.numeros{grid-template-columns:1fr 1fr;align-content:center}}
@media (max-width:640px){.lado{grid-template-columns:minmax(0,1fr)}.est-card{border-left:0;border-top:1px solid var(--linha)}}

.vista{grid-area:vista;min-width:0;display:grid;gap:24px}
.secao{display:grid;gap:10px;min-width:0}
.secao-topo{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.rot{margin:0;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2)}
.h2{margin:0;font-family:var(--f-serif);font-weight:400;font-size:2rem;line-height:1.05;letter-spacing:-.005em;text-wrap:balance}
.h2 em{font-style:italic;color:var(--tx2)}
.intro{margin:4px 0 0;color:var(--tx2);max-width:62ch;font-size:.94rem}
.painel{background:var(--painel);border:1px solid var(--linha);border-radius:14px;overflow:hidden;min-width:0}
.painel.pad{padding:16px 18px}
.vazio{margin:0;padding:22px 20px;color:var(--tx2)}
.vazio em{font-family:var(--f-serif);font-size:1.15em;color:var(--tx)}
.nota{margin:0;font-size:.84rem;color:var(--tx2)}
.nota b{color:var(--tx);font-weight:500}

.barra{height:6px;border-radius:3px;background:var(--linha);overflow:hidden}
.barra i{display:block;height:100%;border-radius:3px;background:var(--tx);transition:width .6s}
.barra.rubro i{background:var(--rubro)}

/* Práticas */
.praticas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.pratica{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:18px 20px;display:grid;gap:12px;align-content:start;min-width:0}
.pratica-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pratica h3{margin:0;font-weight:500;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.pratica h3 svg{width:18px;height:18px;color:var(--tx2)}
.cap-grande{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cap-grande b{font-family:var(--f-serif);font-weight:400;font-size:2.4rem;line-height:1;color:var(--rubro)}
.cap-grande span{font-family:var(--f-serif);font-style:italic;font-size:1.3rem}
.pratica .sub{margin:0;font-size:.88rem;color:var(--tx2)}
.pratica .sub b{color:var(--tx);font-weight:500}
.foco{display:grid;gap:6px}
.foco div{display:flex;align-items:center;gap:8px;font-size:.92rem}
.foco small{color:var(--tx3);font-size:.8rem;margin-left:auto;white-space:nowrap}
.cron{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--linha);border-radius:12px;padding:10px 12px}
.cron b{font-family:var(--f-serif);font-weight:400;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums;min-width:4.2ch}
.cron.fim b{color:var(--ok)}
.acoes{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* Ferramentas do violino */
.ferr{display:grid;gap:12px;background:var(--bg);border:1px solid var(--linha);border-radius:12px;padding:12px 14px}
.ferr-linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ferr-linha > span{font-size:.8rem;font-weight:500;color:var(--tx2);min-width:84px}
.bpm{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--linha);border-radius:10px;background:var(--painel);padding:2px}
.bpm input{width:52px;border:0;background:transparent;text-align:center;font-variant-numeric:tabular-nums;font-weight:500;padding:4px 0}
.bpm input:focus{outline:none}
.pulso{width:10px;height:10px;border-radius:50%;background:var(--linha)}
.pulso.bate{animation:bate .12s ease-out}
@keyframes bate{from{background:var(--rubro);transform:scale(1.3)}to{background:var(--linha)}}

/* Captura */
.captura{display:grid;gap:10px;background:var(--bg);border:1px solid var(--linha);border-radius:14px;padding:14px 16px}
.captura-linha{display:flex;gap:8px}
.captura-linha .campo{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);background:var(--painel);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer;color:var(--tx)}
.chip[aria-pressed="true"]{border-color:var(--tx);background:var(--sup-2)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--linha);border-radius:10px;padding:2px;background:var(--bg);gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 11px;font-size:.86rem;cursor:pointer;color:var(--tx2)}
.seg button[aria-pressed="true"]{background:var(--painel);color:var(--tx);font-weight:500;box-shadow:var(--sombra)}
.seg small{color:var(--tx3);margin-left:4px;font-variant-numeric:tabular-nums}

/* Itens do banco */
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 10px 12px 14px;border-top:1px solid var(--linha)}
.it:first-child{border-top:0}
.it:hover{background:var(--sup)}
.it-tipo{width:30px;height:30px;border-radius:8px;background:var(--sup);display:grid;place-items:center;color:var(--tx2)}
.it-tipo svg{width:16px;height:16px}
.it-t{min-width:0;display:grid;gap:3px;cursor:pointer}
.it-t b{font-weight:500;overflow-wrap:anywhere}
.it-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.8rem;color:var(--tx3)}
.it-meta a{color:var(--tx2);overflow-wrap:anywhere}
.it-acoes{display:flex;align-items:center;gap:2px}
.estrela.on{color:var(--lv-ambos)}
.estrela.on svg{fill:currentColor}
.it.feito b{color:var(--tx2);text-decoration:line-through;text-decoration-color:var(--tx3)}

/* Latim */
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.cap{border:1px solid var(--linha);background:var(--painel);border-radius:9px;padding:8px 4px;display:grid;justify-items:center;gap:2px;cursor:pointer;color:var(--tx3)}
.cap b{font-family:var(--f-serif);font-weight:400;font-size:1.15rem;line-height:1}
.cap small{font-size:.66rem;font-variant-numeric:tabular-nums}
.cap.feito{background:var(--sup-2);color:var(--tx)}
.cap.atual{border-color:var(--rubro);color:var(--rubro);box-shadow:inset 0 0 0 1px var(--rubro)}
.cap.ver{outline:2px solid var(--tx);outline-offset:1px}
.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.duas{grid-template-columns:minmax(0,1fr)}}
.cartao{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:16px 18px;display:grid;gap:12px;align-content:start;min-width:0}
.cartao h4{margin:0;font-weight:500;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cartao h4 em{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:1.15em}
.check{display:grid;gap:0}
.ck{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--linha);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.ck:first-child{border-top:0}
.ck > span:not(.circ){flex:1}
.ck small{color:var(--tx3);font-size:.8rem}
.circ{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--tx3);display:grid;place-items:center;color:transparent;flex:none}
.circ svg{width:12px;height:12px}
.ck:hover .circ{border-color:var(--tx)}
.ck.on .circ{background:var(--tx);border-color:var(--tx);color:var(--painel)}
.ck.on span{color:var(--tx2)}
.grande{font-family:var(--f-serif);font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.grande small{font-family:var(--f-ui);font-size:.86rem;color:var(--tx2);margin-left:6px}
.caixas{display:flex;gap:3px}
.caixas i{width:7px;height:7px;border-radius:2px;background:var(--linha)}
.caixas i.on{background:var(--tx2)}
.voc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:9px 10px 9px 16px;border-top:1px solid var(--linha);font-size:.92rem}
.voc:first-child{border-top:0}
.voc b{font-weight:500;font-style:italic;font-family:var(--f-serif);font-size:1.15em;overflow-wrap:anywhere}
.voc span{color:var(--tx2);overflow-wrap:anywhere}
.grupo-rot{margin:0;padding:9px 16px 5px;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);background:var(--bg);border-top:1px solid var(--linha)}
.grupo-rot:first-child{border-top:0}
.grupo-rot + .voc,.grupo-rot + .ss{border-top:0}
@media (max-width:560px){.voc{grid-template-columns:minmax(0,1fr) auto auto}.voc span{grid-column:1;grid-row:2}}

/* Violino */
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:13px 10px 13px 18px;border-top:1px solid var(--linha)}
.ex:first-child{border-top:0}
.ex-t{min-width:0;display:grid;gap:2px}
.ex-t b{font-weight:500}
.ex-t small{color:var(--tx3);font-size:.82rem}
.ex-bpm{text-align:right;font-size:.86rem;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap;display:grid;justify-items:end;gap:2px}
.ex-bpm b{color:var(--tx);font-weight:500}
.ex.inativo{opacity:.5}
.spark{width:84px;height:22px;display:block}
.spark polyline{fill:none;stroke:var(--tx2);stroke-width:1.5;vector-effect:non-scaling-stroke}
.spark circle{fill:var(--rubro)}

/* Sessões */
.ss{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:10px 10px 10px 16px;border-top:1px solid var(--linha);font-size:.9rem}
.ss:first-child{border-top:0}
.ss-t{min-width:0;display:grid;gap:2px}
.ss-t small{color:var(--tx3);font-size:.8rem;overflow-wrap:anywhere}
.ss-min{font-variant-numeric:tabular-nums;color:var(--tx2);white-space:nowrap}

/* Formulários */
.forma{background:var(--bg);border:1px solid var(--linha);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 14px}
.campos .largo{grid-column:1/-1}
label,.rotulo{display:grid;gap:5px;font-size:.8rem;font-weight:500;color:var(--tx2);min-width:0}
.campo{background:var(--painel);border:1px solid var(--linha);border-radius:9px;padding:8px 10px;font-size:.95rem;font-weight:400;color:var(--tx);width:100%;min-width:0}
.campo:focus{outline:none;border-color:var(--tx2)}
textarea.campo{min-height:70px;resize:vertical}
.campo.num{text-align:right;font-variant-numeric:tabular-nums}
.marcar{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--tx);font-weight:400}
.marcar input{width:17px;height:17px;accent-color:var(--tx)}
.exs-form{display:grid;gap:0;border:1px solid var(--linha);border-radius:10px;background:var(--painel)}
.exs-form > div{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--linha)}
.exs-form > div:first-child{border-top:0}
.exs-form .cab{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);padding-block:6px}
.exs-form .campo{padding:5px 8px;font-size:.88rem}

.faixa{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;background:var(--aviso-bg);color:var(--aviso);font-size:.9rem}
.faixa b{font-weight:600}

/* Flashcard */
.flash{display:grid;gap:14px;text-align:center;justify-items:center;padding:8px 0}
.flash .lat{font-family:var(--f-serif);font-style:italic;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;overflow-wrap:anywhere}
.flash .pt{font-size:1.15rem;color:var(--tx);min-height:1.6em;overflow-wrap:anywhere}
.flash .oculto{color:var(--tx3)}
.flash small{color:var(--tx3)}

/* Folha (modal) */
.veu{position:fixed;inset:0;z-index:30;background:rgba(10,10,9,.45);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:aparecer .15s ease}
.folha{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--painel);border:1px solid var(--linha);border-radius:16px;box-shadow:var(--sombra);padding:20px 22px;display:grid;gap:14px}
.folha-topo{display:flex;justify-content:space-between;align-items:center;gap:8px}
.folha-topo h3{margin:0;font-weight:500;font-size:1.1rem}
.folha-topo h3 em{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:1.15em}
@keyframes aparecer{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:min(520px,calc(100% - 32px));background:var(--btn);color:var(--btn-tx);border-radius:12px;padding:12px 16px;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:aparecer .2s ease;display:grid;gap:2px}
.toast em{font-family:var(--f-serif);font-size:1.1em}
.toast small{opacity:.7}

.carregando{display:grid;place-items:center;gap:14px;padding:60px 16px;color:var(--tx2);text-align:center}
.carregando .iso{width:min(220px,60vw)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lateral{position:static;height:auto;overflow:visible;padding:14px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));gap:10px}
  .nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{width:auto;flex:none}
  .nav-rotulo,.lateral-pe{display:none}
  .principal{margin:6px 0 0;border-radius:18px 18px 0 0;border-left:0;border-right:0;padding:22px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
  .ex{grid-template-columns:minmax(0,1fr) auto}
  .ex .spark-c{display:none}
}
/* ===== Acento único (laranja) e o pontinho do tempo litúrgico ===== */
:root{--ac:#ff9f0a;--ac-tx:#ffb340;--ac-suave:rgba(255,159,10,.2);--ac-sobre:#000000;--lv-estudo:#48484a;--lit:#30d158}
:root[data-lit="verde"]{--lit:#30d158} :root[data-lit="roxo"]{--lit:#bf5af2} :root[data-lit="rosa"]{--lit:#ff6fae}
:root[data-lit="vermelho"]{--lit:#ff453a} :root[data-lit="branco"]{--lit:#f2f2f7} :root[data-lit="ouro"]{--lit:#ffd60a}

.app{box-shadow:inset 0 3px 0 var(--ac)}
.principal{background:transparent;border:0;border-radius:0;margin:0;padding-top:32px}
.painel,.pratica,.cartao{border:0;border-radius:16px;box-shadow:0 1px 2px rgba(20,20,18,.05);background:var(--painel)}
.lado{border:0;border-radius:18px;box-shadow:0 1px 2px rgba(20,20,18,.05)}
.est-card{border-top-color:var(--bg)}
@media (max-width:1180px){.est-card{border-left-color:var(--bg)}}
.captura,.ferr,.forma,.cron{border-color:transparent}
.saudacao{font-family:var(--f-serif);font-weight:400;font-size:clamp(2rem,3.4vw,2.75rem);letter-spacing:-.01em;line-height:1.05}
.saudacao em{font-style:normal;font-size:1em}
.lit{margin:0;display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--tx2)}
.lit i{width:9px;height:9px;border-radius:50%;background:var(--ac)}
.rot{font-size:.95rem;font-weight:600;letter-spacing:0;text-transform:none;color:var(--tx)}
.rot .n{margin-left:8px;font-size:.75rem;font-weight:500;color:var(--tx2);background:var(--sup-2);padding:1px 8px;border-radius:999px}
.tag{border-radius:999px;padding:0 9px;background:color-mix(in srgb,var(--t) 17%,transparent);color:color-mix(in srgb,var(--t) 70%,var(--tx))}
.nav button[aria-current="true"]{background:var(--ac-suave);color:var(--ac-tx);font-weight:600}
.nav button[aria-current="true"] .qtd{color:var(--ac-tx)}
.btn-escuro{background:var(--ac);color:var(--ac-sobre)}
.btn-escuro:hover{opacity:1;filter:brightness(1.07)}
.btn.on{background:var(--ac);color:var(--ac-sobre)}
.chip[aria-pressed="true"]{border-color:var(--ac);background:var(--ac-suave);color:var(--ac-tx)}
.seg{border-color:transparent}
.ck.on .circ{background:var(--ac);border-color:var(--ac);color:var(--ac-sobre)}
.ck:hover .circ{border-color:var(--ac)}
.circ{transition:transform .1s}
.ck:active .circ{transform:scale(.85)}
.barra i,.barra.rubro i{background:var(--ac)}
.cap.atual{border-color:var(--ac);color:var(--ac-tx);box-shadow:inset 0 0 0 1px var(--ac)}
.cap{border-color:transparent;box-shadow:0 1px 2px rgba(20,20,18,.05)}
.cap.feito{background:var(--ac-suave);color:var(--ac-tx)}
.pill.ok{background:var(--ac-suave);color:var(--ac-tx)}
.num.rubro b{color:var(--ac-tx)}
.spark circle{fill:var(--ac)}
.pulso.bate{animation-name:bate2}
@keyframes bate2{from{background:var(--ac);transform:scale(1.3)}to{background:var(--linha)}}
.it,.ex,.ss,.voc{border-top-color:transparent;position:relative}
.painel > .it + .it::before,.painel > .ex + .ex::before,.painel > .ss + .ss::before,.painel > .voc + .voc::before{content:"";position:absolute;left:16px;right:16px;top:-1px;height:1px;background:var(--linha);opacity:.55}
.grupo-rot{border-top:0}
.banner{border:0;min-height:130px;padding:20px clamp(20px,3vw,30px);--banner:var(--painel);--banner-tx:var(--tx);--banner-tx2:var(--tx2);box-shadow:0 1px 2px rgba(20,20,18,.05)}
.banner blockquote{font-size:clamp(1.25rem,2vw,1.5rem)}
.banner .trad{color:var(--tx)}
.banner .btn{background:var(--ac);color:var(--ac-sobre)}
.banner-prog{background:var(--sup-2)}
.banner-prog i{background:var(--ac)}
.banner-arte{width:min(34%,240px);bottom:-18px;right:24px}
.anel-dia{display:flex;align-items:center;gap:14px;padding:4px 0 6px;grid-column:1/-1}
.anel-dia .meio{position:relative;width:58px;height:58px;flex:none}
.anel-dia svg{width:58px;height:58px}
.anel-dia .trilho{stroke:var(--sup-2)}
.anel-dia .feito{stroke:var(--ac);transition:stroke-dashoffset .6s ease}
.anel-dia .meio i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:.86rem}
.anel-dia b{font-weight:600;font-size:1rem;display:block}
.anel-dia span{font-size:.84rem;color:var(--tx2)}
.lateral-pe .link{text-align:left}

/* Tela de entrada (versão de servidor) */
.entrada{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));background:var(--bg);box-shadow:inset 0 3px 0 var(--ac)}
.ent-centro{width:min(380px,100%);display:grid;justify-items:center;gap:14px;text-align:center}
.ent-arte{width:min(220px,60vw)}
.ent-marca{margin:0;font-family:var(--f-serif);font-weight:400;font-size:clamp(2.4rem,8vw,3.4rem);line-height:1}
.ent-sub{margin:0;color:var(--tx2)}
.ent-forma{width:100%;display:grid;gap:12px;text-align:left}
.ent-erro{margin:0;color:var(--alerta);font-size:.88rem}
.ent-aviso{margin:0;padding:10px 12px;border-radius:10px;background:var(--aviso-bg);color:var(--aviso);font-size:.86rem;text-align:left}
.ent-cit{margin:6px 0 0;color:var(--tx3);font-size:.86rem}
.ent-cit em{font-family:var(--f-serif);font-size:1.1em;color:var(--tx2)}
/* Configurações (igual ao Ora et Labora) */
#config-btn{display:flex;align-items:center;gap:11px;width:100%;padding:7px 10px;border:0;border-radius:9px;background:transparent;color:var(--tx);font-size:.94rem;text-align:left;cursor:pointer}
#config-btn:hover{background:var(--sup)}
#config-btn svg{width:18px;height:18px;flex:none}
.lateral-pe{padding:0}
.lateral-pe p{padding:0 10px}
.config-pop{position:fixed;z-index:50;min-width:230px;display:grid;gap:1px;padding:6px;background:var(--painel);border-radius:12px;box-shadow:var(--sombra)}
.config-pop[hidden]{display:none}
.config-pop > button,.config-pop .idioma-sel{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--tx);font:inherit;font-size:.92rem;text-align:left;cursor:pointer;white-space:nowrap}
.config-pop > button:hover,.config-pop .idioma-sel:hover{background:var(--sup)}
.config-pop svg{width:18px;height:18px;flex:none}
.config-pop select{flex:1;min-width:0;border:0;background:transparent;color:var(--tx);font-size:inherit;padding:0;cursor:pointer}
@media (max-width:860px){
  .lateral{position:relative}
  .lateral-pe{display:block;position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));margin:0}
  .lateral-pe p{display:none}
  #config-btn{padding:8px}
  #config-btn span{display:none}
}

/* Tempos do treino de violino */
.plano-lista{display:grid;gap:6px}
.plano-lista div{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.92rem}
.plano-lista small{color:var(--tx2);font-size:.84rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.etapa-at{display:grid;gap:2px}
.etapa-at b{font-family:var(--f-serif);font-weight:400;font-size:1.45rem;line-height:1.15}
.plano-lista .feita span{color:var(--tx3);text-decoration:line-through}
.plano-lista .agora span{font-weight:600;color:var(--ac-tx)}
.tempo-linha{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.tempo-linha > span{min-width:0;overflow-wrap:anywhere}
.passo{display:inline-flex;align-items:center;gap:2px;background:var(--sup);border-radius:10px;padding:2px;flex:none}
.passo b{min-width:58px;text-align:center;font-weight:500;font-size:.9rem;font-variant-numeric:tabular-nums}
.exs-form > div{grid-template-columns:minmax(0,1fr) 62px 62px 62px!important}
@media (max-width:560px){.exs-form > div{grid-template-columns:repeat(3,minmax(0,1fr))!important}.exs-form .marcar{grid-column:1/-1}.exs-form .cab span:first-child{display:none}}

/* Eneida */
.sala.eneida .sala-area{grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}
.ene-barra{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 14px 6px}
.ene-barra select.campo{width:auto;padding:5px 8px;font-size:.9rem}
.ene-barra .campo.num{width:62px;padding:5px 6px;text-align:center;font-size:.9rem}
.ene-barra .de{font-size:.84rem;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ene-quadro{display:grid;gap:14px;align-content:start;padding:8px 18px 18px;max-height:calc(100dvh - 250px);overflow:auto;border-bottom:1px solid var(--linha)}
.ene-topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.ene-num{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.ene-verso{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px;align-items:flex-start;padding-block:6px}
.pal{display:grid;justify-items:center;gap:3px;border:0;background:none;padding:0;cursor:pointer;color:var(--tx)}
.pal b{font-family:var(--f-serif);font-weight:400;font-size:clamp(1.5rem,2.5vw,2rem);line-height:1.15;padding:2px 8px;border-radius:8px;border:1.5px solid transparent;background:var(--sup)}
.pal:hover b{background:var(--sup-2)}
.pal.tem b{background:color-mix(in srgb,var(--k) 24%,transparent);border-color:var(--k)}
.pal.sel b{border-color:var(--ac);background:var(--ac-suave)}
.pal.certa b{box-shadow:0 0 0 2.5px var(--ok)}
.pal.errada b{box-shadow:0 0 0 2.5px var(--alerta)}
.ene-verso.lendo .pal b{background:var(--ac-suave);color:var(--ac-tx)}
.pal small{font-size:.66rem;font-weight:600;letter-spacing:.07em;min-height:1.1em;color:var(--tx2)}
.pal small.gl{font-size:.82rem;font-weight:400;letter-spacing:0;max-width:15ch;text-align:center;line-height:1.25}
.pont{font-family:var(--f-serif);font-size:1.6rem;line-height:1.3;color:var(--tx3);margin-left:-3px}
.ene-quadro > .acoes,.paleta-linha{justify-content:center}
.ene-quadro > p.nota,.ene-quadro > .dic-msg,.ene-quadro > .cor-ok,.ene-quadro > .cor-erro{text-align:center}
.ene-det{display:grid;gap:3px;padding:10px 12px;border-radius:10px;background:var(--sup);font-size:.92rem}
.ene-det b{font-family:var(--f-serif);font-weight:400;font-size:1.25rem}
.ene-det > span:first-of-type{color:var(--tx2);font-size:.86rem}
.ene-det .acoes{margin-top:4px}
.ene-trad{margin:0;padding:8px 12px;text-align:center;font-family:var(--f-serif);font-size:1.25rem;line-height:1.3}
.paleta{display:grid;gap:8px}
.paleta-linha{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.paleta-linha > span{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);min-width:50px}
.tinta{display:inline-flex;align-items:center;gap:6px;border:1.5px solid transparent;background:var(--sup);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer;color:var(--tx)}
.tinta i{width:10px;height:10px;border-radius:3px;background:var(--k)}
.tinta:hover{background:var(--sup-2)}
.tinta[aria-pressed="true"]{border-color:var(--k,var(--tx));background:color-mix(in srgb,var(--k,var(--tx)) 18%,transparent);font-weight:600}
.escansao{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 0;font-family:var(--f-serif);font-size:1.3rem;line-height:1.2}
.sil{position:relative;padding:11px 3px 1px;border-radius:5px}
.sil::before{content:"";position:absolute;left:4px;right:4px;top:3px;height:2.5px;border-radius:2px;background:var(--tx2)}
.sil.breve::before{left:calc(50% - 5px);right:auto;width:10px;height:5px;top:1px;background:none;border:1.5px solid var(--tx2);border-top:0;border-radius:0 0 7px 7px}
.sil.fim{margin-right:9px}
.sil.fim::after{content:"";position:absolute;right:-5px;top:4px;bottom:2px;width:1px;background:var(--tx3)}
.sil.toca{background:var(--ac-suave);color:var(--ac-tx)}
.ene-pass{position:relative;overflow:auto;padding:8px 6px 24px;min-height:110px}
.vl{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:10px;align-items:baseline;width:100%;border:0;background:none;text-align:center;padding:3px 10px;border-radius:8px;cursor:pointer;color:var(--tx);font-family:var(--f-serif);font-size:1.12rem;line-height:1.35}
.vl small{font-family:var(--f-ui);font-size:.7rem;color:var(--tx3);text-align:right;font-variant-numeric:tabular-nums}
.vl:hover{background:var(--sup)}
.vl.at{background:var(--ac-suave);color:var(--ac-tx)}
.vl.pint small{color:var(--ac-tx);font-weight:700}
.vl.pint small::after{content:" •"}
.ene-cartao{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.ene-cartao b{font-family:var(--f-serif);font-weight:400;font-size:1.5rem;line-height:1.1}
@media (max-width:900px){
  .sala.eneida .sala-corpo{display:block}
  .sala.eneida .sala-visor{height:auto;margin-bottom:12px}
  .sala.eneida .sala-area{display:block}
  .ene-quadro{max-height:none;padding-inline:14px}
  .ene-pass{max-height:46dvh}
}

/* Dicionário */
.sala-bloco.bloco-dic textarea,.bloco-dic textarea{min-height:40px;resize:none;overflow:hidden;display:block}
.dic-acoes{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.dic-acoes:empty{display:none}
.dic-dica{font-size:.78rem;color:var(--tx3)}
.dic-trad{margin:0;font-family:var(--f-serif);font-size:1.25rem;line-height:1.25;overflow-wrap:anywhere}
.dic-res{display:grid;gap:6px;font-size:.92rem}
.dic-img{margin:2px 0;display:grid;gap:3px;justify-items:start}
.dic-img img{display:block;max-width:100%;max-height:220px;border-radius:10px;object-fit:contain;background:#fff}
.dic-img figcaption{font-size:.74rem;color:var(--tx3)}
.dic-img figcaption a{color:inherit}
.flash .dic-img{justify-items:center}
.flash .dic-img img{max-height:240px}
.voc-ico{width:34px;height:34px;border-radius:7px;object-fit:cover;background:#fff;vertical-align:middle;margin-right:8px}
.voc-prev{display:grid;gap:6px}
.voc-prev:empty{display:none}
.bloco-dic .seg{justify-self:start}
.ex-campos{display:grid;gap:8px}
.ex-campos label{gap:4px}
.cor-ok{margin:0;font-weight:600;color:var(--ok)}
.cor-erro{margin:0;font-weight:600;color:var(--alerta)}
.cor-item{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:var(--sup)}
.cor-item s{color:var(--alerta);text-decoration-thickness:1.5px;overflow-wrap:anywhere}
.cor-item b{color:var(--ok);font-weight:600;overflow-wrap:anywhere}
.cor-item span{color:var(--tx2);font-size:.86rem}
.cor-final{margin:0;padding:8px 10px;border-left:2px solid var(--ac);font-family:var(--f-serif);font-size:1.1rem;overflow-wrap:anywhere}
.dic-res:empty{display:none}
.dic-termo{font-family:var(--f-serif);font-size:1.3rem;line-height:1.15;overflow-wrap:anywhere}
.dic-sig{margin:0;overflow-wrap:anywhere}
.dic-ana{margin:0;color:var(--tx2);font-size:.86rem}
.dic-ex{margin:0;color:var(--tx2);font-size:.86rem;font-style:italic}
.dic-msg{margin:0;color:var(--tx2);font-size:.88rem}

/* Educação clássica */
.cls-abas{justify-self:start;flex-wrap:wrap}
.cls-legenda{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.78rem;color:var(--tx2)}
.cls-legenda span{display:inline-flex;align-items:center;gap:5px}
.cls-legenda .sep{width:1px;height:14px;background:var(--linha)}
.cls-sw{width:12px;height:12px;border-radius:4px;border:2px solid var(--k);display:inline-block}
.cls-st{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid var(--tx3);flex:none}
.cls-st.lendo{background:var(--ac-suave);border-color:var(--ac)}
.cls-st.lida{background:var(--ac);border-color:var(--ac)}
.cls-mapa{padding:6px;min-height:200px}
.cls-mapa svg{display:block;max-width:none;margin:0 auto}
.cls-rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cls-no{cursor:pointer}
.cls-no rect{fill:var(--painel);stroke:var(--k);stroke-width:1.6}
.cls-no.lendo rect{fill:color-mix(in srgb,var(--ac) 16%,var(--painel))}
.cls-no.lida rect{fill:color-mix(in srgb,var(--k) 22%,var(--painel));stroke-width:2.2}
.cls-no text{font-family:var(--f-ui);font-size:12px;fill:var(--tx)}
.cls-no:hover rect,.cls-no:focus rect{stroke-width:2.6}
.cls-no.sel rect{stroke:var(--ac);stroke-width:3}
.cls-liga{fill:none;stroke:var(--k);stroke-opacity:.35;stroke-width:1.4}
.cls-centro{cursor:pointer}
.cls-centro ellipse{fill:var(--ac-suave);stroke:var(--ac);stroke-width:1.5}
.cls-centro .q{font-family:var(--f-serif);font-size:15px;fill:var(--tx)}
.cls-centro .la{font-family:var(--f-serif);font-style:italic;font-size:11px;fill:var(--tx2)}
.cls-rot{font-family:var(--f-ui);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--tx3)}
.cls-era{fill:var(--sup);opacity:.55}
.cls-era.b{opacity:.9}
.cls-eixo{stroke:var(--tx3);stroke-width:1.5}
.cls-haste{stroke:var(--linha);stroke-width:1}
.cls-marco{fill:var(--tx3)}
.cls-ano{font-family:var(--f-ui);font-size:10px;fill:var(--tx3)}
.cls-inf{fill:none;stroke:var(--ac);stroke-opacity:.45;stroke-width:1.2}
.cls-seta{fill:var(--ac);fill-opacity:.6}
.cls-raio{stroke:var(--linha);stroke-width:1.2}
.cls-arte{cursor:pointer}
.cls-arte circle{fill:var(--painel);stroke:var(--tx3);stroke-width:1.5}
.cls-arte.trivium circle{stroke:#3d6a99}
.cls-arte.quadrivium circle{stroke:#2f7a4b}
.cls-arte.alto circle{stroke:#9a7413;fill:color-mix(in srgb,#9a7413 10%,var(--painel))}
.cls-arte.sel circle{stroke:var(--ac);stroke-width:3;fill:var(--ac-suave)}
.cls-arte .nm{font-family:var(--f-serif);font-size:15px;fill:var(--tx)}
.cls-arte.centro .nm{font-size:18px}
.cls-arte .ct{font-family:var(--f-ui);font-size:10px;fill:var(--tx2)}
.cls-dica{text-align:center}
.cls-chips{display:flex;flex-wrap:wrap;gap:6px}
.cls-chip{display:grid;justify-items:start;gap:0;border:1.6px solid var(--k);background:var(--painel);border-radius:10px;padding:5px 10px;cursor:pointer;color:var(--tx);text-align:left}
.cls-chip b{font-weight:500;font-size:.88rem}
.cls-chip small{font-size:.72rem;color:var(--tx3)}
.cls-chip.lendo{background:color-mix(in srgb,var(--ac) 14%,var(--painel))}
.cls-chip.lida{background:color-mix(in srgb,var(--k) 20%,var(--painel))}
.cls-chip.sel{box-shadow:0 0 0 2px var(--ac)}
.cls-arte-obras{display:grid;gap:8px;margin-top:10px}
.cls-estreito{display:grid;gap:14px;padding:8px}
.cls-q{border:1.5px solid var(--ac);background:var(--ac-suave);border-radius:16px;padding:14px;display:grid;gap:4px;text-align:center;cursor:pointer;color:var(--tx)}
.cls-q b{font-family:var(--f-serif);font-weight:400;font-size:1.15rem}
.cls-q small{font-family:var(--f-serif);font-style:italic;color:var(--tx2)}
.cls-col{display:flex;flex-wrap:wrap;gap:6px}
.cls-rot-h{flex-basis:100%;margin:0;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--k)}
.cls-ficha{display:grid;gap:14px}
.cls-ficha-topo{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cls-ficha h3{margin:2px 0 0;font-family:var(--f-serif);font-weight:400;font-size:1.6rem;line-height:1.15}
.cls-autor{margin:0;color:var(--tx2)}
.cls-nota{margin:0;padding:10px 12px;border-left:2px solid var(--ac);background:var(--sup);border-radius:0 8px 8px 0}
.cls-linha{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.cls-linha .rotulo{min-width:86px}
.cls-bloco{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--linha)}
.cls-bloco h4{margin:0;font-size:.95rem;font-weight:600}
.cls-bloco-topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.cls-perg{margin:0;padding-left:20px;display:grid;gap:6px}
.cls-conf{display:grid;gap:6px;font-size:.92rem}
.cls-conf p,.cls-conf ul{margin:0}
.cls-conf ul{padding-left:20px;display:grid;gap:4px}
.cls-conc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:var(--sup)}
.cls-conc div{display:grid;gap:2px;min-width:0}
.cls-conc span{font-size:.88rem;color:var(--tx2)}
.cls-texto{align-items:flex-start}
.cls-texto small{font-size:.82rem;color:var(--tx2);line-height:1.4}
.cls-conc .cls-texto-acao{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cls-texto-acao .btn svg{width:15px;height:15px}
.cls-bib{margin-top:6px}
.cls-girando{color:var(--ac-tx)}
@media (max-width:560px){ .cls-texto{flex-direction:column;align-items:stretch} .cls-conc .cls-texto-acao{justify-content:flex-end} }
.sala-area iframe.leitura{background:#fbf8f1}
.cls-q-topo h3{margin:4px 0;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:1.5rem}
.cls-art{display:grid;gap:8px;margin-bottom:10px}
.cls-num{margin:0;font-weight:600;color:var(--tx2)}
.cls-fonte{max-width:420px}
.cls-resp{min-height:180px}
.cls-cit{display:grid;gap:6px;margin-bottom:12px}
.cls-cit blockquote{margin:0;font-family:var(--f-serif);font-size:1.2rem;line-height:1.35}
.cls-it .cls-st{margin-top:2px}

/* Tipos de estudo */
.tipos-lista{display:grid;gap:8px}
.tipo-linha{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.tipo-linha input[type=color]{width:34px;height:34px;padding:2px;border:1px solid var(--linha);border-radius:9px;background:var(--painel);cursor:pointer}
.tipo-n{font-size:.8rem;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.novo{border-style:dashed;color:var(--tx2);background:transparent}

/* Biblioteca */
.zona-envio{display:grid;justify-items:center;gap:6px;padding:22px 16px;border:1.5px dashed var(--tx3);border-radius:14px;text-align:center;color:var(--tx2);font-size:.92rem;cursor:pointer;background:transparent}
.zona-envio:hover,.zona-envio.sobre{border-color:var(--ac);color:var(--tx);background:var(--ac-suave)}
.zona-envio b{color:var(--tx);font-weight:500}
.zona-envio small{color:var(--tx3)}
.oculto-arq{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.envios{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;width:min(320px,calc(100vw - 32px));display:grid;gap:8px;background:var(--painel);border-radius:14px;box-shadow:var(--sombra);padding:12px 14px}
.envios[hidden]{display:none}
.envio{display:grid;gap:4px;font-size:.84rem}
.envio span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.envio small{color:var(--tx2)}

/* Sala de estudo */
body.em-sala{overflow:hidden}
.sala{position:fixed;inset:0;z-index:25;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr);box-shadow:inset 0 3px 0 var(--ac);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sala[hidden]{display:none}
.sala-topo{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));min-width:0}
.sala-tit{min-width:0;flex:1;display:grid}
.sala-tit b{font-family:var(--f-serif);font-weight:400;font-size:1.3rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sala-tit small{font-size:.8rem;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sala-tempo{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ac-tx);white-space:nowrap}
.sala-corpo{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:0 max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.sala-visor{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--painel);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(20,20,18,.05)}
.sala-abas{grid-row:1;display:flex;gap:4px;overflow-x:auto;padding:8px 10px 0}
.sala-abas:empty{display:none}
.sala-abas button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:.84rem;color:var(--tx2);cursor:pointer;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.sala-abas button[aria-pressed="true"]{background:var(--ac-suave);color:var(--ac-tx);font-weight:600}
.sala-area{grid-row:2;min-width:0;min-height:0;position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.sala-area iframe,.sala-area video{width:100%;height:100%;border:0;display:block;background:#000}
.sala-area iframe.doc{background:#fff}
.sala-area img{width:100%;height:100%;object-fit:contain}
.sala-area audio{width:calc(100% - 32px);align-self:center;justify-self:center}
.sala-aviso{align-self:center;justify-self:center;display:grid;justify-items:center;gap:12px;text-align:center;padding:32px 20px;max-width:440px;color:var(--tx2)}
.sala-aviso h3{margin:0;font-family:var(--f-serif);font-weight:400;font-size:1.6rem;line-height:1.1;color:var(--tx)}
.sala-aviso p{margin:0}
.sala-lado{min-height:0;overflow-y:auto;display:grid;gap:14px;align-content:start;padding:2px}
.sala-bloco{background:var(--painel);border-radius:16px;padding:14px 16px;display:grid;gap:10px;box-shadow:0 1px 2px rgba(20,20,18,.05)}
.sala-bloco h4{margin:0;font-weight:600;font-size:.92rem}
.sala-bloco textarea{min-height:150px}
.sala-bloco .check .ck{padding:6px 0;font-size:.9rem}
.ir-chips{display:flex;flex-wrap:wrap;gap:6px}
.salvo{font-size:.76rem;color:var(--tx3)}
@media (max-width:600px){
  .sala-topo{flex-wrap:wrap}
  .sala-tit{flex:1 1 calc(100% - 46px)}
  .sala-tempo{margin-right:auto;margin-left:40px}
}
@media (max-width:900px){
  .sala-corpo{grid-template-columns:minmax(0,1fr);grid-template-rows:none;overflow-y:auto;align-content:start}
  .sala-visor{height:68dvh}
  .sala-lado{overflow:visible}
}

/* Leitor de PDF */
.leitor{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);position:relative}
.leitor-barra{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:8px 10px}
.leitor-barra .campo{width:56px;padding:4px 6px;text-align:center;font-variant-numeric:tabular-nums;font-size:.88rem}
.leitor-barra .de{font-size:.84rem;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.leitor-barra .esp{flex:1}
.leitor-rolo{overflow:auto;background:var(--sup);padding:10px;-webkit-overflow-scrolling:touch}
.leitor-folha{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.leitor-folha canvas{display:block}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:rgba(217,162,27,.4);color:transparent}
.leitor-sum{position:absolute;left:10px;top:48px;z-index:6;width:min(320px,calc(100% - 20px));max-height:calc(100% - 60px);overflow:auto;background:var(--painel);border-radius:12px;box-shadow:var(--sombra);padding:6px;display:grid;gap:1px}
.leitor-sum button{border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:8px;font-size:.88rem;color:var(--tx);cursor:pointer}
.leitor-sum button:hover{background:var(--sup)}
.leitor-sum button.sub{padding-left:24px;color:var(--tx2);font-size:.82rem}

/* ===== Ilhas pretas: as peças (valores do guia da identidade) ===== */
html,body{background:var(--fundo)}
body{margin:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::selection{background:rgba(255,159,10,.35)}

/* Coluna de botões redondos + ilha */
.app{grid-template-columns:78px minmax(0,1fr);column-gap:12px;padding-right:18px;background:var(--fundo);box-shadow:none}
.lateral{padding:18px 0 14px 14px;align-items:center;gap:12px;scrollbar-width:none}
.lateral::-webkit-scrollbar{display:none}
.marca{width:48px;height:48px;border-radius:50%;background:#000;border:1px solid var(--borda-rd);display:grid;place-items:center;padding:0;font-weight:800;font-size:19px;letter-spacing:-.02em;flex:none;margin-bottom:2px}
.nav{display:flex;flex-direction:column;align-items:center;gap:12px}
.nav button,#config-btn{position:relative;width:48px;height:48px;padding:0;border-radius:50%;background:#000;border:1px solid var(--borda-rd);color:#fff;display:flex;align-items:center;justify-content:center;gap:0;cursor:pointer;flex:none;transition:background .15s,transform .12s}
.nav button:hover,#config-btn:hover{background:#1c1c1e}
.nav button:active,#config-btn:active{transform:scale(.95)}
.nav button[aria-current="true"],.nav button[aria-current="true"]:hover{background:#fff;color:#000;border-color:#fff;font-weight:600}
.nav svg,#config-btn svg{width:21px;height:21px}
.nav button > span:not(.qtd),#config-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav .qtd,.nav button[aria-current="true"] .qtd{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;margin:0;border-radius:9px;background:var(--trilho);color:#fff;font-size:10px;font-weight:700;line-height:18px;text-align:center}
.nav .qtd.rubro{background:var(--alerta);color:#fff}
.nav-rotulo{width:22px;height:1px;margin:2px 0;padding:0;background:var(--linha);font-size:0;line-height:0;overflow:hidden;flex:none}
.lateral-pe{margin-top:auto;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.lateral-pe p{display:none}
.config-pop{background:var(--painel-solido);border:1px solid var(--linha);border-radius:15px;box-shadow:var(--sombra-ilha)}
.config-pop > button,.config-pop .idioma-sel{border-radius:10px;font-size:14px}
.config-pop > button:hover,.config-pop .idioma-sel:hover{background:var(--sup)}
.config-pop select option{background:#1c1c1e;color:#fff}

.principal{min-width:0;align-self:start;margin:0;background:var(--ilha);border:1px solid rgba(255,255,255,.08);border-top:0;border-radius:0 0 32px 32px;box-shadow:var(--sombra-ilha);padding:14px 20px 28px;min-height:calc(100dvh - 18px)}
.topo{max-width:none;margin:0 0 18px;gap:8px 12px}
.lit{font-size:13px;color:var(--tx2);gap:7px}
.lit i{width:7px;height:7px;border-radius:50%;background:var(--lit)}
.topo-dir{gap:10px}
.data-hoje{font-size:13px;color:var(--tx2)}

/* Tipografia: uma fonte só; hierarquia pelo negrito, sem itálico decorativo */
.h2{font-family:var(--f-ui);font-size:20px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.h2 em,.saudacao em,.cartao h4 em,.est-tit em,.vazio em,.folha-topo h3 em,.toast em,.ent-cit em,.lateral-pe em{font-style:normal;font-family:var(--f-ui);font-size:1em;color:inherit}
.saudacao{font-family:var(--f-ui);font-size:16px;font-weight:700;letter-spacing:0}
.rot{font-size:15px;font-weight:700;color:var(--tx)}
.rot .n{background:var(--trilho);color:#fff;font-weight:700;font-size:11px}
.intro{font-size:13.5px;color:var(--tx2)}
.nota{font-size:13px}
.num small{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--tx2)}
.num b,.grande,.cron b,.cap-grande b{font-family:var(--f-ui);font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--tx)}
.num.rubro b{color:var(--alerta)}
.cap-grande span{font-family:var(--f-ui);font-style:normal;font-size:16px;font-weight:600}
.grande small{font-size:12.5px}
.etapa-at b{font-family:var(--f-ui);font-size:16px;font-weight:700}
.pratica h3,.cartao h4{font-weight:700;font-size:15px}
.pratica h3 svg{color:var(--tx)}
.est-tit{font-weight:700}
.voc b{font-family:var(--f-ui);font-style:normal;font-weight:600;font-size:1em}
.flash .lat{font-family:var(--f-ui);font-style:normal;font-weight:700;font-size:clamp(1.6rem,5vw,2.1rem)}
.cap b{font-family:var(--f-ui);font-weight:700;font-size:1rem}
.folha-topo h3{font-weight:700;font-size:16px}
.vazio em{font-weight:600}

/* Quadrados de borda fina, sem sombra */
.painel,.pratica,.cartao,.lado,.banner,.sala-bloco{background:var(--painel);border:1px solid var(--borda);border-radius:15px;box-shadow:none}
.captura,.ferr,.forma,.cron,.est-arte{background:var(--bg);border:1px solid var(--borda)}
.est-card{border-top-color:var(--linha)}
@media (max-width:1180px){.est-card{border-left-color:var(--linha)}}
.it:hover{background:rgba(255,255,255,.035)}
.it-tipo{background:var(--sup);color:var(--tx);border-radius:10px}
.painel > .it + .it::before,.painel > .ex + .ex::before,.painel > .ss + .ss::before,.painel > .voc + .voc::before{background:var(--linha);opacity:1}
.grupo-rot{background:transparent}

/* Sentença do dia: um quadrado simples, sem a arte */
.banner{min-height:0;padding:16px 18px}
.banner-texto{max-width:none}
.banner-arte{display:none}
.banner blockquote{font-family:var(--f-ui);font-style:normal;font-size:17px;font-weight:600;line-height:1.35}
.banner .btn{background:var(--sup);color:#fff}
.banner-prog{background:var(--trilho)}
.banner-prog i{background:#fff}

/* Botões: pílulas; laranja só na ação principal */
.btn{border-radius:999px;height:34px;padding:0 15px;font-weight:600;font-size:14px;transition:background .15s,transform .12s}
.btn:active{transform:scale(.97)}
.btn-p{height:30px;padding:0 13px;font-size:13px;border-radius:999px}
.btn-escuro,.btn.on{background:#fff;color:#000;border:0}
.btn-escuro:hover{background:#e5e5ea;filter:none;opacity:1}
.btn-claro{background:var(--sup);color:#fff;border:0}
.btn-claro:hover{background:var(--sup-2)}
.btn-ac{background:var(--ac-suave);color:var(--ac);font-weight:700}
.btn-ac:hover{background:rgba(255,159,10,.28)}
.icone-btn{border-radius:50%;color:var(--tx2)}
.icone-btn:hover{background:var(--sup);color:#fff}
.link{color:var(--tx2);text-decoration-color:var(--tx3)}
.link:hover{color:#fff}
.estrela.on{color:#fff}

/* Selos, tags e chips */
.pill{border-color:var(--linha);color:var(--tx2)}

/* ---------- Isometria: a estante ---------- */
function estante(opts){
  opts=opts||{};
  var u=opts.u||13, C=Math.cos(Math.PI/6), mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  function P(x,y,z){ var a=(x-y)*C*u, b=(x+y)*0.5*u - z*u; if(a<mnx)mnx=a; if(a>mxx)mxx=a; if(b<mny)mny=b; if(b>mxy)mxy=b; return a.toFixed(1)+','+b.toFixed(1); }
  function poly(pts,cls){ return '<polygon class="'+cls+'" points="'+pts.map(function(p){return P(p[0],p[1],p[2]);}).join(' ')+'"/>'; }
  function box(x,y,z,w,d,h,c){ c=c||{}; return poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],c.e||'f-esq')+poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],c.d||'f-dir')+poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],c.t||'f-top'); }
  var dias=opts.dias||[], W=7.6, D=1.5, H=4.7, s='';
  var alturas=[1.55,1.35,1.72,1.45,1.62,1.4];
  function livros(z, ini){
    var out='';
    for(var k=0;k<6;k++){
      var dia=dias[ini+k], x=0.42+k*1.13, h=alturas[(k+ini)%6];
      if(dia){
        out+='<g class="livro" style="--i:'+(ini+k)+';--lv:var(--lv-'+dia+')">'+box(x,0.22,z,0.84,1.08,h,{t:'lv-t',e:'lv-e',d:'lv-d'})+
          poly([[x,1.3,z+h*0.72],[x+0.84,1.3,z+h*0.72],[x+0.84,1.3,z+h*0.8],[x,1.3,z+h*0.8]],'lv-b')+'</g>';
      } else out+=box(x,0.22,z,0.84,1.08,h,{t:'f-fant',e:'f-fant',d:'f-fant'});
    }
    return out;
  }
  if(!opts.semChao) s+=box(-1,-1,-0.3,W+2,D+2.4,0.3,{t:'f-chao'});
  s+=box(0,0,0,W,0.16,H);           // fundo
  s+=box(0,0,0,0.22,D,H);           // lateral esquerda
  s+=box(0,0,0,W,D,0.22);           // base
  s+=livros(0.22,6);                // prateleira de baixo: dias mais recentes
  s+=box(0.22,0,2.3,W-0.44,D,0.2);  // prateleira do meio
  s+=livros(2.5,0);                 // prateleira de cima: dias mais antigos
  s+=box(0,0,H,W,D,0.22);           // tampo
  s+=box(W-0.22,0,0,0.22,D,H+0.22); // lateral direita
  // vela no tampo
  s+=box(5.9,0.55,H+0.22,0.36,0.36,0.75);
  var c=P(6.08,0.73,H+1.02).split(','), cx=+c[0], cy=+c[1];
  s+='<path class="chama" d="M'+cx+' '+(cy-11)+' C'+(cx+5)+' '+(cy-4)+' '+(cx+3.5)+' '+(cy+1)+' '+cx+' '+(cy+1)+' C'+(cx-3.5)+' '+(cy+1)+' '+(cx-5)+' '+(cy-4)+' '+cx+' '+(cy-11)+'Z"/>';
  mny=Math.min(mny,cy-12);
  var pd=6;
  return '<svg class="iso '+(opts.cls||'')+'" viewBox="'+(mnx-pd).toFixed(0)+' '+(mny-pd).toFixed(0)+' '+(mxx-mnx+2*pd).toFixed(0)+' '+(mxy-mny+2*pd).toFixed(0)+'" role="img" aria-label="'+esc(opts.label||'Estante')+'">'+s+'</svg>';
}

function ultimos12(){
  var out=[], h=hoje();
  for(var i=11;i>=0;i--){
    var d=somaDias(h,-i), l=false, v=false, o=false;
    S.sess.forEach(function(s){ if(s.data===d){ if(s.pratica==='latim') l=true; else if(s.pratica==='violino') v=true; else o=true; } });
    out.push(l&&v?'ambos':l?'latim':v?'violino':o?'estudo':null);
  }
  return out;
}
function sequencia(){
  var set={}; S.sess.forEach(function(s){ set[s.data]=1; });
  var d=hoje(); if(!set[d]) d=somaDias(d,-1);

  return n;
}

function erroGravar(e){ var c=e&&e.code; toast('Não consegui salvar', c==='quota_exceeded'?'O espaço do Scriptorium acabou.':c==='invalid_argument'?'Você não tem permissão para alterar este painel.':'Tente de novo em instantes.'); }

function sino(){
  if(!actx) return;
  [0,0.4,0.8].forEach(function(t,i){
    var o=actx.createOscillator(), g=actx.createGain(), t0=actx.currentTime+t;

}

function enviarArquivo(file,extra,livro){
  if(!SERVIDOR) return;

    fim(); var j={}; try{ j=JSON.parse(x.responseText); }catch(err){}

    var doc=j.doc; doc.id=j.id; if(!S.arqs.some(function(a){ return a.id===j.id; })) S.arqs.push(doc);

/* Som: "Ouvir" e "Cantar" usam a voz do servidor, com a pronúncia reconstituída. */
var eneSom={nos:[],tm:[]};
function eneParar(){
  eneSom.tm.forEach(clearTimeout); eneSom.tm=[];
  eneSom.nos.forEach(function(o){ try{ o.stop(); }catch(e){} }); eneSom.nos=[];
  document.querySelectorAll('.ene-verso.lendo').forEach(function(e){ e.classList.remove('lendo'); });
  document.querySelectorAll('.sil.toca').forEach(function(e){ e.classList.remove('toca'); });
}
/* Ouvir: a voz do servidor lê o verso com a pronúncia reconstituída (c = k, v = u, ae ditongo, vogais longas). */
function eneOuvir(){
  var k=eneChave(), livro=ENE.livro, rot=eneRot(), ck='fala:'+k;
  if(!prepararSom()){ toast('Este navegador não deixou tocar som.'); return; }
  eneParar();
  if(ENE.canto[ck]){ eneTocarBuf(ENE.canto[ck]); return; }
  var aqui=function(){ return eneAtiva()&&eneChave()===k; };
  ENE.cantoEsp=k; ENE.cantoTipo='fala'; eneQuadro();
  fetch('/api/eneida/fala/'+livro+'/'+encodeURIComponent(rot),{credentials:'same-origin'}).then(function(r){
    if(!r.ok) throw new Error('http '+r.status);
    return r.arrayBuffer().then(function(b){ return new Promise(function(ok,nao){ actx.decodeAudioData(b,ok,nao); }); });
  }).then(function(buf){ ENE.canto[ck]=buf; ENE.cantoEsp=null; if(aqui()){ eneQuadro(); eneTocarBuf(buf); } },
    function(e){ console.error(e); ENE.cantoEsp=null; if(aqui()){ eneQuadro(); toast('Não consegui gerar a leitura do verso.'); } });
}
function eneTocarBuf(buf){
  eneParar();
  var src=actx.createBufferSource(); src.buffer=buf; src.connect(actx.destination); src.start(actx.currentTime+0.05); eneSom.nos.push(src);
  var v=document.querySelector('.ene-verso'); if(v){ v.classList.add('lendo'); eneSom.tm.push(setTimeout(function(){ v.classList.remove('lendo'); },buf.duration*1000+100)); }
}
function eneRitmo(){
  var k=eneChave(), livro=ENE.livro, rot=eneRot(); ENE.esc=true;
  if(!prepararSom()) toast('Este navegador não deixou tocar som.');
  eneUsar().then(function(an){
    if(!an||!eneAtiva()||eneChave()!==k||!an.silabas||!an.silabas.length||!actx) return;
    if(ENE.canto[k]){ eneTocarVoz(ENE.canto[k]); return; }
    var aqui=function(){ return eneAtiva()&&eneChave()===k; };
    ENE.cantoEsp=k; ENE.cantoTipo='canto'; eneQuadro();
    fetch('/api/eneida/canto/'+livro+'/'+encodeURIComponent(rot),{credentials:'same-origin'}).then(function(r){
      if(!r.ok) throw new Error('http '+r.status);
      var tp=(r.headers.get('X-Tempos')||'').split(',').map(Number);
      return r.arrayBuffer().then(function(b){ return new Promise(function(ok,nao){ actx.decodeAudioData(b,ok,nao); }); }).then(function(buf){ return {buf:buf,tempos:tp}; });
    }).then(function(c){ ENE.canto[k]=c; ENE.cantoEsp=null; if(aqui()){ eneQuadro(); eneTocarVoz(c); } },
      function(e){ console.error(e); ENE.cantoEsp=null; if(aqui()){ eneQuadro(); toast('Não consegui gerar a voz.','Tocando só o ritmo do verso.'); eneTocar(an.silabas); } });
  });
}
function eneTocarVoz(c){
  eneParar();
  var limpa=function(){ document.querySelectorAll('.sil.toca').forEach(function(x){ x.classList.remove('toca'); }); };
  var src=actx.createBufferSource(); src.buffer=c.buf; src.connect(actx.destination); src.start(actx.currentTime+0.06); eneSom.nos.push(src);
  var t=60; c.tempos.forEach(function(d,i){ eneSom.tm.push(setTimeout(function(){ limpa(); var e=document.querySelector('.sil[data-s="'+i+'"]'); if(e) e.classList.add('toca'); },t)); t+=d*1000; });
  eneSom.tm.push(setTimeout(limpa,t+60));
}
function eneTocar(sil){
  eneParar();
  var u=0.26, t=actx.currentTime+0.08, t0=t, pe=0, pos=0;
  var limpa=function(){ document.querySelectorAll('.sil.toca').forEach(function(x){ x.classList.remove('toca'); }); };
  sil.forEach(function(s,i){
    var ult=i===sil.length-1, dur=(s.longa||ult?2:1)*u, f=ult?196:pos===0?(pe===4?293.66:261.63):220, vol=pos===0?0.2:0.13;
    var o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.03); g.gain.setValueAtTime(vol,t+dur-0.07); g.gain.exponentialRampToValueAtTime(0.0001,t+dur-0.005);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur); eneSom.nos.push(o);
    eneSom.tm.push(setTimeout(function(){ limpa(); var e=document.querySelector('.sil[data-s="'+i+'"]'); if(e) e.classList.add('toca'); },(t-t0)*1000+80));
    t+=dur; if(s.fim_do_pe){ pe++; pos=0; } else pos++;
  });
  eneSom.tm.push(setTimeout(limpa,(t-t0)*1000+120));
}

 {id:'cicero',autor:'Cícero',curto:'Cícero',titulo:'Do orador (De Oratore)',ano:-55,etapa:'raizes',pos:'favor',artes:['retorica','filosofia'],nota:'O orador ideal precisa saber de tudo: a eloquência unida à sabedoria. Daqui vem a ideia romana de humanitas.',inf:['isocrates','platao']},

function mudarTema(){ tema=TEMAS[(TEMAS.indexOf(tema)+1)%3]; lsSet('scr-tema',tema); aplicarTema(); }


/* ---------- Versão de servidor (Railway): login e dados no disco ---------- */
function api(metodo,url,corpo){
  var h={'X-Scriptorium':'1'}; if(corpo!==undefined) h['Content-Type']='application/json';
  return fetch(url,{method:metodo,headers:h,credentials:'same-origin',cache:'no-store',body:corpo!==undefined?JSON.stringify(corpo):undefined}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){
      if(r.status===401 && S.usuario){ location.reload(); }
      if(!r.ok) throw {code:'unavailable', status:r.status, message:j.erro||'Não consegui falar com o servidor.'};
      return j;
    });
  }, function(){ throw {code:'unavailable', status:0, message:'Sem conexão com o servidor. Confira a internet.'}; });
}
function novoIdLocal(){ var a=new Uint8Array(15), s=''; crypto.getRandomValues(a); for(var i=0;i<a.length;i++) s+='abcdefghijklmnopqrstuvwxyz0123456789'[a[i]%36]; return s; }
/* Mesmo jeito de usar do banco do artifact (doc, collection, where, onSnapshot, set, delete), guardado no servidor. */
function criarBanco(){
  var cache={}, seq=0, subs=[], pronto=false, emCurso=null, deNovo=false;
  function copia(o){ return o===undefined?undefined:JSON.parse(JSON.stringify(o)); }
  function snap(p){ var d=cache[p]; return {id:p.split('/')[1], exists:d!==undefined, data:function(){ return copia(d); }}; }
  function testa(v,op,x){ switch(op){ case '==':return v===x; case '!=':return v!==x; case '<':return v<x; case '<=':return v<=x; case '>':return v>x; case '>=':return v>=x; } return true; }
  function rodar(s){
    try{
      if(s.tipo==='doc') return s.cb(snap(s.path));
      var ds=Object.keys(cache).filter(function(p){ if(p.split('/')[0]!==s.col) return false; var d=cache[p]; return s.filtros.every(function(f){ return testa(d[f[0]],f[1],f[2]); }); }).sort().map(snap);
      s.cb({docs:ds,size:ds.length,empty:!ds.length});
    }catch(e){ console.error(e); }
  }
  function notificar(){ if(pronto) subs.slice().forEach(rodar); }
  function aplicar(r){ if(r.completo) cache={}; Object.keys(r.docs||{}).forEach(function(p){ cache[p]=r.docs[p]; }); (r.apagados||[]).forEach(function(p){ delete cache[p]; }); seq=r.seq; }
  function sincronizar(){
    if(!pronto) return Promise.resolve();
    if(emCurso){ deNovo=true; return emCurso; }
    emCurso=api('GET','/api/dados?desde='+seq).then(function(r){ aplicar(r); notificar(); }).catch(function(e){ console.warn('[scriptorium] sincronização', e); })
      .then(function(){ emCurso=null; if(deNovo){ deNovo=false; return sincronizar(); } });
    return emCurso;
  }
  function partes(p){ var a=String(p).split('/'); if(a.length!==2||!a[0]||!a[1]) throw new TypeError('Caminho inválido: '+p); return a; }
  function enviar(metodo,p,dados){
    var a=partes(p);
    return api(metodo,'/api/doc/'+encodeURIComponent(a[0])+'/'+encodeURIComponent(a[1]),dados===undefined?undefined:{data:dados})
      .then(function(){}, function(e){ seq=0; cache={}; api('GET','/api/dados').then(function(r){ aplicar(r); notificar(); }).catch(function(){}); throw e; });
  }
  function doc(p){
    partes(p);
    return {
      id:p.split('/')[1],
      set:function(d){ cache[p]=copia(d); notificar(); return enviar('PUT',p,d); },
      'delete':function(){ delete cache[p]; notificar(); return enviar('DELETE',p); },
      onSnapshot:function(cb){ var s={tipo:'doc',path:p,cb:cb}; subs.push(s); if(pronto) setTimeout(function(){ rodar(s); },0); return function(){ var i=subs.indexOf(s); if(i>=0) subs.splice(i,1); }; }
    };
  }
  function consulta(col,filtros){
    return {
      where:function(f,op,v){ return consulta(col,filtros.concat([[f,op,v]])); },
      onSnapshot:function(cb){ var s={tipo:'col',col:col,filtros:filtros,cb:cb}; subs.push(s); if(pronto) setTimeout(function(){ rodar(s); },0); return function(){ var i=subs.indexOf(s); if(i>=0) subs.splice(i,1); }; },
      doc:function(id){ return doc(col+'/'+(id||novoIdLocal())); }
    };
  }
  function ouvir(){
    try{ var es=new EventSource('/api/eventos'); es.onmessage=function(e){ if(Number(e.data)>seq) sincronizar(); }; }catch(e){}
    document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') sincronizar(); });
    window.addEventListener('online',sincronizar);
    setInterval(sincronizar,60000);
  }
  return {
    doc:doc, collection:function(c){ return consulta(c,[]); }, sincronizar:sincronizar,
    iniciar:function(){ return api('GET','/api/dados').then(function(r){ aplicar(r); pronto=true; notificar(); ouvir(); }); }
  };
}
function telaEntrada(modo,erro){
  var el=document.getElementById('entrada'), c;
  if(modo==='erro') c='<p class="ent-sub">Não consegui falar com o servidor. Confira a internet e tente de novo.</p><button class="btn btn-escuro" data-act="recarregar">Tentar de novo</button>';
  else c='<p class="ent-sub">'+(modo==='primeiro'?'Primeiro acesso. Crie a sua conta com um nome e uma senha.':'Seus estudos: banco, latim e violino.')+'</p>'+
    (S.semDisco?'<p class="ent-aviso">O servidor está sem disco: os dados somem a cada atualização. Ligue um volume em /data no Railway antes de começar.</p>':'')+
    '<form class="ent-forma" data-form="'+(modo==='primeiro'?'primeiro':'entrar')+'">'+
      '<label>Nome<input class="campo" id="en-nome" required autocomplete="username" autocapitalize="words"></label>'+
      '<label>Senha<input class="campo" id="en-senha" type="password" required autocomplete="'+(modo==='primeiro'?'new-password':'current-password')+'"'+(modo==='primeiro'?' minlength="6"':'')+'></label>'+
      (modo==='primeiro'?'<label>Repita a senha<input class="campo" id="en-senha2" type="password" required minlength="6" autocomplete="new-password"></label>':'')+
      '<p class="ent-erro" id="en-erro"'+(erro?'':' hidden')+'>'+esc(erro||'')+'</p>'+
      '<button class="btn btn-escuro" type="submit">'+(modo==='primeiro'?'Criar conta e entrar':'Entrar')+'</button></form>'+
    '<p class="ent-cit"><em lang="la">“Tolle, lege.”</em> Santo Agostinho</p>';
  el.innerHTML='<div class="ent-centro"><div class="ent-arte">'+estante({dias:ultimos12(),label:'Estante'})+'</div><h1 class="ent-marca">Scriptorium</h1>'+c+'</div>';
  el.hidden=false; document.getElementById('app').hidden=true;
  var n=document.getElementById('en-nome'); if(n) n.focus();
}
document.addEventListener('submit',function(ev){
  var f=ev.target, tipo=f.dataset.form;
  if(tipo!=='entrar' && tipo!=='primeiro') return;
  ev.preventDefault(); ev.stopImmediatePropagation();
  var nome=document.getElementById('en-nome').value.trim(), senha=document.getElementById('en-senha').value, err=document.getElementById('en-erro');
  function mostra(m){ err.textContent=m; err.hidden=false; }
  if(tipo==='primeiro' && senha!==document.getElementById('en-senha2').value){ mostra('As duas senhas não são iguais.'); return; }
  var b=f.querySelector('button[type=submit]'); b.disabled=true;
  api('POST',tipo==='primeiro'?'/api/primeiro-acesso':'/api/entrar',{nome:nome,senha:senha}).then(function(j){ entrar(j.usuario); }, function(e){ mostra(e.message); b.disabled=false; });
},true);
document.addEventListener('click',function(ev){ var el=ev.target.closest('[data-act="recarregar"]'); if(el) location.reload(); });
function entrar(usuario){
  S.usuario=usuario;
  document.getElementById('entrada').hidden=true; document.getElementById('app').hidden=false;
  document.getElementById('sair-btn').hidden=false;
  render();
  var db=criarBanco(); conectar(db); carregarEspaco();
  db.iniciar().catch(function(e){ document.getElementById('vista').innerHTML='<div class="pagina"><div class="carregando"><p>'+esc(e.message||'Não consegui carregar os dados.')+'</p><button class="btn btn-escuro" data-act="recarregar">Tentar de novo</button></div></div>'; });
}
function iniciarServidor(){
  document.getElementById('app').hidden=true;
  api('GET','/api/estado').then(function(e){
    S.semDisco=!!e.semDisco;
    if(e.logado) entrar(e.usuario); else telaEntrada(e.primeiroAcesso?'primeiro':'entrar');
  }, function(){ telaEntrada('erro'); });
}

/* ---------- Início ---------- */
aplicarTema();
aplicarIdioma();
obsTr.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTRS_TR});
render();
if(window.SCRIPTORIUM_SERVIDOR) iniciarServidor();
else (async function(){
  var db=null;
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db=null; }
  if(!db){ S.semDb=true; render(); return; }
  conectar(db);
})();
document.addEventListener('visibilitychange',function(){ if(!document.hidden && !S.modal) pedirRender(); });
})();
</script>
